title = "002: Every mistake moves the line"

# Draft 9 (Claude, 2026-11-01), after council rounds 1 to 3, the pacing
# lens and five rounds of adversarial review (docs/series/reviews/002/).
# Spine (Nate): the perceptron's rule only reacts to mistakes, and its
# pulls never cancel, so it never stops; the square trick shrinks the
# total squared miss, its pulls cancel, and it settles near the
# fewest-mistakes border but not on it; fewest mistakes is a staircase.

[[section]]
kind = "introduction"
title = "Introduction"

[[section.line]]
id = "about"
text = "This is a series about what really goes on inside neural networks, worked out on games for the Nintendo Entertainment System."
board = "The series' NES, then Super Mario Bros. on its screen"
framing = true

[[section.line]]
id = "last-time"
text = "Last time, we built one artificial neuron. While Mario was in the air, it read two numbers from the game's memory, his depth and his falling speed, and answered one question: will he land within the next ten frames?"
board = "Mario mid-jump; his depth and falling speed read out beside him; the question beneath"
cite = ["exp001"]

[[section.line]]
id = "both-matter"
text = "Both numbers matter, because at the same depth he might be rising or falling."
board = "Two Marios at the same height, one rising, one falling"
cite = ["exp001"]

[[section.line]]
id = "the-map"
text = "On a map with depth along one side and speed along the other, each moment in the air is a dot, and the neuron's answer is a straight border across the map."
board = "001's map: each moment a dot, placed by depth and falling speed, coloured by whether he landed soon; a straight border across it"
cite = ["exp001"]

[[section.line]]
id = "last-time-2"
text = "We chose that border ourselves, by trying every one we could and keeping the best. It was right {search} of the time, on play it hadn't seen."
spoken = "We chose that border ourselves, by trying every one we could and keeping the best. It was right {search_spoken} of the time, on play it hadn't seen."
board = "Borders sweep across the map, one after another; the best one stays, its bar at {search}"
cite = ["exp001", "exp002"]

[[section.line]]
id = "test-question"
text = "It's only a test question. Knowing the answer wouldn't help anyone play. Its value is that the recording shows whether he landed within those ten frames, so every answer the neuron gives can be checked."
board = "Mario mid-jump with 'Will he land soon?' beside him; the recording scrubs ahead and a tick appears"
cite = ["exp001"]

[[section.line]]
id = "too-many"
text = "Trying every border only works because there were only a few numbers. A neuron reading more of the two thousand and forty-eight numbers in the console's memory would have far too many borders to try."
board = "The map's two axes multiply into a crowd of axes; the sweeping borders blur into too many to draw"
cite = ["exp001", "nesdev-memory"]

[[section.line]]
id = "no-fast-way"
text = "And in general, no known method finds the border with the fewest mistakes quickly."
board = "A clock spinning beside the crowd of borders"
cite = ["hoffgen1995"]

[[section.line]]
id = "learn"
text = "So a neuron has to find its own weights, how much each number counts, and its own bias, which together set its border."
board = "The formula's dials, unset, and a border on the map that isn't there yet"
cite = ["rosenblatt1962"]

[[section.line]]
id = "learn-2"
text = "Ours starts with all of them at zero, and moves them every time it makes a mistake."
board = "The dials all at zero; then a border appears on the map and twitches toward a wrong dot"
cite = ["rosenblatt1962", "exp002"]

[[section.line]]
id = "this-video"
text = "This video watches that happen, on the same question, and finds out why it never settles down, and what learning does instead."
board = "The twitching border, never still"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "Every mistake moves the line"

[[section.line]]
id = "rule-intro"
role = "intro"
text = "First, the rule. Remember how the neuron works: it multiplies each number by a weight, adds them up along with the bias, a fixed amount that slides its border, and if that total is above zero, it says yes."
board = "The formula from 001: depth and speed into their dials, the bias, the total against zero"
cite = ["exp001", "bishop2006"]

[[section.line]]
id = "same-scale"
text = "Depth and speed are measured on very different scales, so first we put them on the same one, so that a step means the same for both: how far each is from its average, counted in its own typical spread, a bit like grading on a curve."
board = "Depth's long axis and speed's short one shrink and stretch until they're the same length, centred on their averages"
cite = ["exp002"]

[[section.line]]
id = "one-at-a-time"
text = "Now it sees one moment at a time, and the recording says whether Mario really landed soon. If the neuron was right, nothing changes."
board = "One dot lights up on the map; beside it, the recording's verdict; the dot is on the right side and the border stays still"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-wrong"
text = "If it was wrong, the weights move. Say Mario was low and falling fast, and the neuron said not yet, but he landed. His depth, which grows as he gets lower, and his falling speed are both above average, so both weights turn up, each by a fixed step times its own number: the bigger the number, the bigger the turn."
board = "The wrong dot's two numbers feed the dials: each dial turns up in proportion to its number"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-bias"
text = "The bias turns up one step too."
board = "The bias dial ticks up"
cite = ["serrano2021"]

[[section.line]]
id = "rule-flip"
text = "For that same moment, if he hadn't landed, everything would turn down instead."
board = "The same dot, now coloured as not landed; every dial turns down"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-signs"
text = "A number below its average counts as negative, and that turns its weight the other way. Say Mario was high and rising, below average on both, and the neuron said yes, but he didn't land. Both weights turn up, not down, because a bigger weight times a negative number makes the total smaller."
board = "The moment's total shown beside the dials; a high, rising dot: both dials turn up, and the total drops toward no"
cite = ["rosenblatt1962", "bishop2006"]

[[section.line]]
id = "rule-why"
text = "Either way, that moment's total moves toward the side it belongs on, and the border swings toward getting that moment right."
board = "The wrong dot's total climbs toward zero; the border tilts toward the dot"
cite = ["bishop2006"]

[[section.line]]
id = "rule-name"
text = "That's the perceptron's learning rule. Frank Rosenblatt introduced the perceptron in nineteen fifty-eight, and set out this rule by sixty-two."
board = "Rosenblatt's name, with the two years, beside the rule's formula"
cite = ["rosenblatt1958", "rosenblatt1962"]

[[section.line]]
id = "mark-one"
text = "His Mark One Perceptron machine kept its weights in knobs turned by electric motors."
board = "A drawing of the Mark I Perceptron's racks of motor-turned knobs, beside the formula's dials"
cite = ["rosenblatt1962"]

[[section.line]]
id = "passes"
text = "We show it the moments over and over. One trip through all of them, in a shuffled order, is called a pass, and it gets thirty passes."
board = "The dots stream past the border one by one; a counter ticks up passes to thirty"
cite = ["exp002"]

[[section.line]]
id = "step-size-2"
text = "How big should the step be? For this rule, starting from zero, it doesn't matter. Its weights are only its nudges, added up, so a bigger step makes every weight and the bias bigger by the same amount. Remember from last time: that doesn't move the border at all."
board = "One border, its dials doubled, then halved: the line doesn't move"
cite = ["exp001", "exp002"]

[[section.line]]
id = "step-size"
text = "So a neuron with {bigger_step} times the step has the same border at every moment, makes exactly the same mistakes, and takes the same nudges, {bigger_step} times bigger. We checked: after every pass, its weights were exactly {bigger_step} times the other's."
spoken = "So a neuron with {bigger_step_spoken} times the step has the same border at every moment, makes exactly the same mistakes, and takes the same nudges, {bigger_step_spoken} times bigger. We checked: after every pass, its weights were exactly {bigger_step_spoken} times the other's."
board = "Two runs side by side, one with {bigger_step} times the step: their dials read {bigger_step} times apart, their borders the same line"
cite = ["exp002"]

[[section.line]]
id = "guarantee"
text = "If some straight border puts every yes on one side and every no on the other, the rule is proven to stop, after a limited number of mistakes."
board = "Two colours a straight border can split; the rule's border twitches a few times and stops on one that splits them"
cite = ["novikoff1962"]

[[section.line]]
id = "guarantee-check"
text = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a line does split the rest. The rule got every one of them right, and stopped moving after {control_last_moving_pass} passes."
spoken = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a line does split the rest. The rule got every one of them right, and stopped moving after {control_last_moving_pass_spoken} passes."
board = "Mario's map with the best border's wrong dots removed; the border moves for {control_last_moving_pass} passes, then stays still, every dot on its side"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "rule-outro"
role = "conclusion"
text = "So we've gone from choosing the border ourselves to a rule that moves it, one mistake at a time. But put the troublemakers back, and no straight border splits Mario's moments."
board = "The removed dots return, overlapping near the border"
cite = ["exp001", "exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "It never settles"

[[section.line]]
id = "never-intro"
role = "intro"
text = "In fact, no border of any shape could get them all right."
board = "Mario's map; a straight border, then a wiggly one, each still leaving wrong dots"
cite = ["exp002"]

[[section.line]]
id = "spots"
text = "The two numbers we read are whole numbers, so the moments it learns from sit on just {spots} spots of Mario's map. At {spots_with_both} of those spots, the very same depth and speed sometimes landed and sometimes didn't."
spoken = "The two numbers we read are whole numbers, so the moments it learns from sit on just {spots_spoken} spots of Mario's map. At {spots_with_both_spoken} of those spots, the very same depth and speed sometimes landed and sometimes didn't."
board = "Mario's map zoomed in: dots stacked on a grid of whole numbers; the spots holding both colours outlined"
cite = ["exp002", "exp001"]

[[section.line]]
id = "unseen"
text = "That's because the neuron can't see everything that matters. Neither number says what's under Mario, and last time, most of the best border's mistakes were landings on something raised, bounces off enemies, and falls into pits."
board = "Two Marios at the same depth and speed: one above a pipe, one above a pit"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "always-wrong"
text = "So wherever the border goes, some moment is wrong, and the rule moves it again. Every pass has a mistake in it, so the weights never stop changing."
board = "The border nudges at a wrong dot, and a new dot becomes wrong"
cite = ["exp002"]

[[section.line]]
id = "bounded"
text = "Later, mathematicians proved that the weights stay within limits. With mistakes that never run out, they wander inside them, and never settle."
board = "The weights' dials wandering inside a ring, never leaving it, never still"
cite = ["minsky1969", "block1970"]

[[section.line]]
id = "exam"
text = "After every pass, we scored it on a recording it never learned from, like an exam it hasn't seen."
board = "A separate recording waits; after each pass, the border is scored on it"
cite = ["exp002"]

[[section.line]]
id = "one-run"
text = "Over its last ten passes, its score kept jumping, from as low as {perceptron_one_run_lowest} to as high as {perceptron_one_run_highest}."
spoken = "Over its last ten passes, its score kept jumping, from as low as {perceptron_one_run_lowest_spoken} to as high as {perceptron_one_run_highest_spoken}."
board = "The border swinging across the map pass after pass; a score bar jumping with it, its ten values listed: {perceptron_one_run}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "order"
text = "So where it ends up is partly luck. Changing only the order of the moments, it ended its thirtieth pass anywhere from {perceptron_lowest} to {perceptron_highest}."
spoken = "So where it ends up is partly luck. Changing only the order of the moments, it ended its thirtieth pass anywhere from {perceptron_lowest_spoken} to {perceptron_highest_spoken}."
board = "Ten final borders from ten orders, scattered; their bars spread from {perceptron_lowest} to {perceptron_highest}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "dropped"
text = "A tiny change does it too. Keeping the order the same, but leaving out just {dropped_moments} of the {train_moments} moments, left it anywhere between {perceptron_dropped_lowest} and {perceptron_dropped_highest}."
spoken = "A tiny change does it too. Keeping the order the same, but leaving out just {dropped_moments_spoken} of the {train_moments_spoken} moments, left it anywhere between {perceptron_dropped_lowest_spoken} and {perceptron_dropped_highest_spoken}."
board = "Thirty dots fade out of sixteen thousand; the final border lands somewhere else"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "who-moves-it"
text = "Looking inside the learning shows who keeps it moving most. The moments even the best border gets wrong are only {wrong_for_search} of all the moments, but over its last ten passes, they caused {wrong_share_of_nudges} of the nudges: far more than their share."
spoken = "Looking inside the learning shows who keeps it moving most. The moments even the best border gets wrong are only {wrong_for_search_spoken} of all the moments, but over its last ten passes, they caused {wrong_share_of_nudges_spoken} of the nudges: far more than their share."
board = "Each dot sized by how many nudges it caused; the best border's wrong dots, few but large"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "remember"
text = "One cheap fix is to remember. In a version of an idea called the pocket algorithm, of the lines it ended each pass with, we kept the one that did best on the moments it learned from. That scored {pocket_lowest} to {pocket_highest} in all ten orders."
spoken = "One cheap fix is to remember. In a version of an idea called the pocket algorithm, of the lines it ended each pass with, we kept the one that did best on the moments it learned from. That scored {pocket_lowest_spoken} to {pocket_highest_spoken} in all ten orders."
board = "The swinging border, with a still copy left behind where it did best; its bar steady across ten orders"
cite = ["gallant1990", "exp002"]

[[section.line]]
id = "never-outro"
role = "conclusion"
text = "So the perceptron's rule only reacts to mistakes, and its nudges are never any smaller for being nearly right. On Mario's moments, something is always wrong, so it never stops. What would a rule need, to stop?"
board = "The border still swinging, never still"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "How wrong was it?"

[[section.line]]
id = "square-intro"
role = "intro"
text = "The perceptron's rule ignores how wrong a moment was: a moment just over the border and one far over it get the same kind of nudge, sized only by their numbers. A different rule asks how far off each moment was."
board = "Two wrong dots, one just over the border and one far over; each nudge sized by the dot's numbers, not by how far over it is"
cite = ["rosenblatt1962", "widrow1960"]

[[section.line]]
id = "target"
text = "Give every moment a target for its total: plus one if Mario landed soon, minus one if he didn't. The neuron still says yes above zero, and the targets sit one on either side of it."
board = "The total's dial with a target mark at plus one, and another dial with its mark at minus one"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-rule"
text = "Then after every moment, right or wrong, each weight moves in proportion to three things: a small step, its own number, and how far the total missed the target, in the direction that closes the gap. The bias moves the same way."
board = "The gap between total and target sets the size and direction of the nudge to each dial"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-example"
text = "If a moment's target is plus one and its total was a fifth, it fell short by four fifths, and each weight moves by four fifths of a step times its number, pulling the total up toward the target."
board = "A total of 0.2 against the target plus one: short by 0.8, pulled up"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-over"
text = "A total of three is right, by plenty, but it overshot its target by two, so, for the same numbers, the weights move to pull it back down, two and a half times as hard."
board = "A total of 3 against the same target: over by 2, pulled back down; beside the first, the two nudges drawn to scale"
cite = ["widrow1960", "bishop2006"]
pause = 3.0

[[section.line]]
id = "square-why"
text = "Each nudge shrinks that moment's miss. Over all the moments, on average, it shrinks one number: every moment's miss, multiplied by itself, then all added up. Call it the total squared miss."
board = "Each moment's miss drawn as a square, the squares piling up into one total that shrinks as the border moves"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "square-why-2"
text = "Squaring makes falling short and overshooting count alike, and makes big misses count more."
board = "A miss short and a miss over, the same size, making the same square; a miss twice as big making a square four times as large"
cite = ["bishop2006"]

[[section.line]]
id = "square-name"
text = "This rule is known as the Widrow-Hoff rule, or least mean squares: Bernard Widrow and Ted Hoff published it in nineteen sixty. One textbook, using it to fit lines through points, calls it the square trick."
board = "The rule's formula beside the perceptron's, with Widrow and Hoff's names and the year"
cite = ["widrow1960", "bishop2006", "serrano2021"]

[[section.line]]
id = "animals"
text = "Psychologists later described something essentially the same for how animals learn to expect what follows a signal, like food after a sound."
board = "A sound, then food; the same formula beneath"
cite = ["rescorla1972", "sutton1981"]

[[section.line]]
id = "downhill"
text = "Picture the total squared miss as ground over every possible setting of the weights and bias. Added up over all the moments, the square trick's nudges always point downhill on that ground. That's what we'll call following a slope."
board = "Ground over the dials' settings, shown as a slice through one dial: a U shape; the added-up nudge an arrow pointing down it"
cite = ["bishop2006"]

[[section.line]]
id = "settles"
text = "Each moment pulls by how far it missed: up if its total fell short, down if it overshot, and each pull shrinks smoothly as its total nears its target."
board = "Arrows from every moment, up for short and down for over, each shrinking as its total nears its mark"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "balance"
text = "That ground has a single lowest point, and there, all the pulls cancel and add up to exactly nothing, like a tug of war at a standstill."
board = "At the bottom of the U, the arrows add to nothing"
cite = ["bishop2006", "exp002"]

[[section.line]]
id = "settles-2"
text = "Single moments still tug. If it learns one moment at a time, its score wobbles, by about {square_swing_points} point."
spoken = "Single moments still tug. If it learns one moment at a time, its score wobbles, by about {square_swing_points_spoken} point."
board = "The border trembling, one moment at a time"
cite = ["exp002"]

[[section.line]]
id = "settles-3"
text = "If it adds up every moment's nudge before taking one step, a small enough step, it comes to rest."
board = "All the nudges added into one; the border still"
cite = ["exp002", "bishop2006"]
pause = 3.0

[[section.line]]
id = "too-big"
text = "Here, the size of the step does matter. Too big, and each nudge overshoots, pushing the totals past their targets by more than they were missing. With {too_big_step} times the step, the total squared miss grew at every one of its {too_big_steps} steps, to {too_big_growth} times where it started."
spoken = "Here, the size of the step does matter. Too big, and each nudge overshoots, pushing the totals past their targets by more than they were missing. With {too_big_step_spoken} times the step, the total squared miss grew at every one of its {too_big_steps_spoken} steps, to {too_big_growth_spoken} times where it started."
board = "A total swinging back and forth across its target, each swing wider; beside it, the total squared miss climbing"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "rest-outro"
role = "conclusion"
text = "So from a rule that only reacts to mistakes, we've come to one that weighs how far off every moment is, and that can come to rest. But where does it rest?"
board = "The square trick's border, still"
cite = ["exp002", "widrow1960"]
pause = 1.0

[[section]]
kind = "chapter"
title = "Close, but not quite"

[[section.line]]
id = "short"
role = "intro"
text = "It comes to rest at a border that is right {batch_square} of the time, not {search}. It and the best border answer differently on {batch_square_disagrees_with_search} of moments."
spoken = "It comes to rest at a border that is right {batch_square_spoken} of the time, not {search_spoken}. It and the best border answer differently on {batch_square_disagrees_with_search_spoken} of moments."
board = "The square trick's resting border and the best border on the same map; the dots they disagree on lit"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-short"
text = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is past its target. It scored {hinge}: a little closer, but still not the best border. We didn't find the whole reason."
spoken = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is past its target. It scored {hinge_spoken}: a little closer, but still not the best border. We didn't find the whole reason."
board = "A dot deep on its correct side, its pull cut; the border barely moves"
cite = ["exp002"]

[[section.line]]
id = "how-far"
text = "What we can say is that neither version counts mistakes. Both add up squared misses, the second leaving out moments past their target, and their lowest points land close to, but not on, the border with the fewest mistakes."
board = "Two borders side by side: one judged by adding up squared misses, one by counting wrong dots"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "square-outro"
text = "So the square trick settles, in nearly the same place every time, but that place was chosen by the squared misses we gave it, not by the count of mistakes we wanted. So why not aim straight at the fewest mistakes?"
board = "The square trick's still border beside the fewest-mistakes border, also still, a gap between them"
cite = ["exp002", "bishop2006"]
pause = 1.0

[[section.line]]
id = "map-intro"
text = "To see why not, we need a new picture: a sheet of borders."
board = "Mario's map, with its border; beside it, a blank sheet labelled 'borders'"
framing = true

[[section.line]]
id = "map-axes"
text = "Picture a border on Mario's map as a ruler laid across it, with a yes side and a no side. You can turn the ruler, and half way round, its sides swap; or you can slide it nearer to or further from the middle, where depth and speed are both at their averages."
board = "A ruler-like border on Mario's map turning, its yes side swapping at half a turn, and sliding"
cite = ["exp001", "exp002"]

[[section.line]]
id = "sheet"
text = "Now picture a flat sheet where every spot is one whole border: moving left or right on the sheet turns the ruler, all the way round from one edge to the other, and moving up or down slides it."
board = "A single spot on the border sheet moving, the ruler on Mario's map moving to match; leaving the right edge brings it back on the left"
cite = ["exp001", "exp002"]

[[section.line]]
id = "staircase"
text = "Imagine the sheet as ground, with each spot raised to a height: how many mistakes that border makes. Lower is better."
board = "The border sheet rising into ground, each spot lifted by its border's mistakes"
cite = ["exp002"]

[[section.line]]
id = "staircase-2"
text = "The height only changes when the border crosses a moment, so between those crossings it's perfectly flat. The ground is a staircase."
board = "Terraces: flat ledges, sudden drops, a narrow lowest ledge with a cliff along one side"
cite = ["exp002"]

[[section.line]]
id = "big-drops"
text = "And because so many moments share a spot, some of the drops are big: crossing a single spot can change the count by {spot_biggest_change} moments at once."
spoken = "And because so many moments share a spot, some of the drops are big: crossing a single spot can change the count by {spot_biggest_change_spoken} moments at once."
board = "A border crossing one crowded spot; the mistake count jumps"
cite = ["exp002"]

[[section.line]]
id = "no-slope"
text = "Standing on a flat step, every direction looks the same. Only a drop tells you which way is down, and you find it by falling off. So a rule that follows a slope, like the square trick, can't walk down this staircase."
board = "A marker on a ledge, looking every way; all directions level"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "perceptron-score"
text = "The perceptron's rule doesn't walk the staircase either. Each of its nudges is a step down a measure of its own, for the one moment that caused it: how far that wrong moment's total is past zero, on the wrong side."
board = "One wrong dot; its total, past zero on the wrong side; the nudge pulling it back"
cite = ["bishop2006"]

[[section.line]]
id = "perceptron-zero"
text = "Added up over every wrong moment, that measure is lowest with every weight and the bias at zero. Shrink them all, and every total shrinks with them, though the border stays put. At zero, no mistake costs anything."
board = "The formula's dials shrinking toward zero; the wrong moments' totals shrinking with them, the border not moving"
cite = ["bishop2006"]

[[section.line]]
id = "perceptron-hover"
text = "But it can't rest there. At zero, the neuron says no to everything, so every moment where Mario landed is wrong, and pushes it back out at full size."
board = "The dials at zero; every landed dot lit as wrong, each shoving the dials outward"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "perceptron-hover-2"
text = "So its weights hover close to zero, about {perceptron_nudges_from_zero} nudges away, where each nudge changes them by about half their own size, and the border, and the score, keep jumping."
spoken = "So its weights hover close to zero, about {perceptron_nudges_from_zero_spoken} nudges away, where each nudge changes them by about half their own size, and the border, and the score, keep jumping."
board = "The dials hovering near zero, each nudge a big swing; the border jumping on Mario's map"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "batch"
text = "We also tried adding up all its nudges before each step, as the square trick can. It still moved on every one of {batch_perceptron_steps} steps, and over its last hundred steps, its score kept swinging, mostly between {batch_perceptron_low_tenth} and {batch_perceptron_highest}."
spoken = "We also tried adding up all its nudges before each step, as the square trick can. It still moved on every one of {batch_perceptron_steps_spoken} steps, and over its last hundred steps, its score kept swinging, mostly between {batch_perceptron_low_tenth_spoken} and {batch_perceptron_highest_spoken}."
board = "All the perceptron's nudges added into one, step after step; the border still jumping, its bar swinging"
cite = ["exp002"]

[[section.line]]
id = "batch-2"
text = "Adding them up doesn't help. Every wrong moment's pull points partly back toward zero, so the pulls all share that direction, and added up, they can't come to nothing. On Mario's moments, something is always wrong, so there is always a pull."
board = "Each wrong dot's arrow on the dials, every one tilted back toward zero; added up, an arrow that never vanishes"
cite = ["bishop2006", "exp002"]

[[section.line]]
id = "staircase-outro"
role = "conclusion"
text = "So the count of mistakes, the thing we actually want, is a staircase no slope-following rule can walk down, and the perceptron's own measure keeps it hopping near zero. The square trick's measure has a very different shape."
board = "The staircase, and the dials hopping near zero"
cite = ["exp002", "bishop2006"]
pause = 1.0

[[section]]
kind = "chapter"
title = "A bowl"

[[section.line]]
id = "bowl"
role = "intro"
text = "Now give the border sheet a different height: each border's total squared miss."
board = "The same border sheet, its height now the total squared miss"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "best-size"
text = "A border doesn't fix how big its weights are, and the squared miss depends on that, so each border gets whatever size suits it best."
board = "One border shown with small, medium and large weights; the best size picked"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "shelf"
text = "The size can't go below zero without swapping the border's yes side."
board = "A border's weights shrinking to zero and stopping there; past it, the yes side would flip"
cite = ["exp002"]

[[section.line]]
id = "shelf-2"
text = "For nearly all the borders that get most moments wrong, {most_wrong_flat} of them, any size adds more miss than it takes away, so their best is to shrink to nothing, where every total is zero and every miss is one. On this sheet, that's a high, flat shelf."
spoken = "For nearly all the borders that get most moments wrong, {most_wrong_flat_spoken} of them, any size adds more miss than it takes away, so their best is to shrink to nothing, where every total is zero and every miss is one. On this sheet, that's a high, flat shelf."
board = "A backwards border shrinking its weights to nothing; its spot on the sheet joining a high flat shelf"
cite = ["exp002"]

[[section.line]]
id = "bowl-2"
text = "Everywhere else on the sheet, the ground curves smoothly down into one bowl, with one lowest point, and that's the border where the square trick comes to rest."
board = "Beside the shelf, one smooth bowl; the square trick's resting border marked at its bottom"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "no-shelf"
text = "The rule starts at zero, right on that shelf. But the shelf belongs to this picture, not to the rule. The rule moves the weights themselves, and there, the total squared miss slopes everywhere but at its very bottom, zero included."
board = "The sheet set aside; the rule's dials, and a smooth slope under them with no flat part"
cite = ["bishop2006", "exp002"]

[[section.line]]
id = "two-bottoms"
text = "But on the same sheet, the bottom of the bowl and the lowest step are different spots. The border at the bottom of the bowl is right {bowl_bottom} of the time; the one on the lowest step, {stairs_bottom}."
spoken = "But on the same sheet, the bottom of the bowl and the lowest step are different spots. The border at the bottom of the bowl is right {bowl_bottom_spoken} of the time; the one on the lowest step, {stairs_bottom_spoken}."
board = "The two heights on one sheet: the bowl's bottom and the lowest ledge, marked apart"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-bowls"
text = "With two numbers, we could search the staircase ourselves. With many, nobody knows a fast way to, so learning aims at a measure with a slope instead. Here, that's a bowl, and its lowest point isn't the lowest step."
board = "The staircase fades into fog; the bowl stays clear"
cite = ["hoffgen1995", "bishop2006", "exp002"]

[[section.line]]
id = "map-outro"
role = "conclusion"
text = "On Mario's moments, the perceptron's pulls never cancel out, so it can't stop. The square trick's do, so it settles, but slightly off."
board = "The staircase and the bowl side by side, each with its marker"
cite = ["exp002"]

[[section]]
kind = "conclusions"
title = "Conclusions"

[[section.line]]
id = "tldr"
text = "In short: a neuron can learn its own border by moving it after each mistake. On Mario's moments, which no border can split, that rule never settles: it ended anywhere from {perceptron_lowest} to {perceptron_highest}, depending even on just the order it saw them."
spoken = "In short: a neuron can learn its own border by moving it after each mistake. On Mario's moments, which no border can split, that rule never settles: it ended anywhere from {perceptron_lowest_spoken} to {perceptron_highest_spoken}, depending even on just the order it saw them."
board = "The swinging border and its spread of scores"
cite = ["rosenblatt1962", "exp002"]
pause = 3.0

[[section.line]]
id = "tldr-2"
text = "Nudging to shrink the total squared miss instead, with its nudges added up before each step, settles, at {batch_square}, because its added-up pull fades smoothly to nothing at one spot, the lowest point of the ground over its weights, which is the bowl's lowest border, where the moments' pulls balance."
spoken = "Nudging to shrink the total squared miss instead, with its nudges added up before each step, settles, at {batch_square_spoken}, because its added-up pull fades smoothly to nothing at one spot, the lowest point of the ground over its weights, which is the bowl's lowest border, where the moments' pulls balance."
board = "The bowl, with the square trick resting at its bottom"
cite = ["widrow1960", "exp002"]
pause = 3.0

[[section.line]]
id = "tldr-3"
text = "Fewest mistakes would be better, but it's a staircase with no slope to follow. So learning aims at a measure with a slope, here a bowl, and the bowl's bottom scored {bowl_bottom}, not the lowest step's {stairs_bottom}."
spoken = "Fewest mistakes would be better, but it's a staircase with no slope to follow. So learning aims at a measure with a slope, here a bowl, and the bowl's bottom scored {bowl_bottom_spoken}, not the lowest step's {stairs_bottom_spoken}."
board = "The staircase and the bowl, their lowest points apart"
cite = ["exp002", "hoffgen1995"]
pause = 3.0

[[section.line]]
id = "inside"
text = "So even for one neuron, what it learned depends on how it learned, and on the moments it was shown. The perceptron's border is one of many it could have ended on. The square trick's is nearly the same every time, but it's the answer to the total we gave it."
board = "The fan of perceptron borders from many runs; the square trick's single still border among them"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "next"
text = "Next time: when the line lies. Data that breaks the assumptions a single neuron quietly makes, including one byte that lets it cheat."
board = "The border on a new map, with a suspiciously perfect split"
framing = true

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
closing = true
