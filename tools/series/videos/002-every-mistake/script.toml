title = "002: Every mistake moves the line"

# Draft 5 (Claude, 2026-11-01), after council rounds 1 to 3, the pacing
# lens and the first two adversarial reviews (docs/series/reviews/002/).
# Spine (Nate): the perceptron's rule only reacts to mistakes, and its
# pulls never cancel, so it never stops; the square trick shrinks the
# total squared miss, its pulls cancel, and it settles near the
# fewest-mistakes border but not on it; fewest mistakes is a staircase.

[[section]]
kind = "introduction"
title = "Introduction"

[[section.line]]
id = "about"
text = "This is a series about what really goes on inside neural networks, worked out on games for the Nintendo Entertainment System."
board = "The series' NES, then Super Mario Bros. on its screen"
framing = true

[[section.line]]
id = "last-time"
text = "Last time, we built one artificial neuron. While Mario was in the air, it read two numbers from the game's memory, his depth and his falling speed, and answered one question: will he land within the next ten frames?"
board = "Mario mid-jump; his depth and falling speed read out beside him; the question beneath"
cite = ["exp001"]

[[section.line]]
id = "both-matter"
text = "Both numbers matter, because at the same depth he might be rising or falling. On a map with depth along one side and speed along the other, each moment in the air is a dot, and the neuron's answer is a straight border across the map."
board = "001's map: each moment a dot, placed by depth and falling speed, coloured by whether he landed soon; a straight border across it"
cite = ["exp001"]

[[section.line]]
id = "last-time-2"
text = "We chose that border ourselves, by trying every one we could and keeping the best. It was right {search} of the time, on play it hadn't seen."
spoken = "We chose that border ourselves, by trying every one we could and keeping the best. It was right {search_spoken} of the time, on play it hadn't seen."
board = "Borders sweep across the map, one after another; the best one stays, its bar at {search}"
cite = ["exp001", "exp002"]

[[section.line]]
id = "test-question"
text = "It's only a test question. Knowing the answer wouldn't help anyone play. Its value is that the recording shows whether he landed within those ten frames, so every answer the neuron gives can be checked."
board = "Mario mid-jump with 'Will he land soon?' beside him; the recording scrubs ahead and a tick appears"
cite = ["exp001"]

[[section.line]]
id = "too-many"
text = "Trying every border only works because there were two numbers. A neuron reading more of the two thousand and forty-eight numbers in the console's memory would have far too many borders to try, and in general, no known method finds the one with the fewest mistakes quickly."
board = "The map's two axes multiply into a crowd of axes; the sweeping borders blur into too many to draw"
cite = ["exp001", "hoffgen1995"]

[[section.line]]
id = "learn"
text = "So a neuron has to find its own weights, how much each number counts, and its own bias, which is to say its own border. Ours starts with all of them at zero, and moves them a little every time it makes a mistake."
board = "The formula's dials all at zero; then a border appears on the map and twitches toward a wrong dot"
cite = ["rosenblatt1962", "exp002"]

[[section.line]]
id = "this-video"
text = "This video watches that happen, on the same question, and finds out why it never quite settles down, and what learning does instead."
board = "The twitching border, never still"
framing = true
pause = 1.0

[[section]]
kind = "chapter"
title = "Every mistake moves the line"

[[section.line]]
id = "rule-intro"
role = "intro"
text = "First, the rule. Remember how the neuron works: it multiplies each number by a weight, adds them up with the bias, its built-in lean, and if that total is above zero, it says yes."
board = "The formula from 001: depth and speed into their dials, the bias, the total against zero"
cite = ["exp001", "bishop2006"]

[[section.line]]
id = "same-scale"
text = "Depth and speed are measured on very different scales, so first we put them on the same one, so that a step means the same for both: how far each is from its average, counted in its own typical spread, a bit like grading on a curve."
board = "Depth's long axis and speed's short one shrink and stretch until they're the same length, centred on their averages"
cite = ["exp002"]

[[section.line]]
id = "one-at-a-time"
text = "Now it sees one moment at a time, and the recording says whether Mario really landed soon. If the neuron was right, nothing changes."
board = "One dot lights up on the map; beside it, the recording's verdict; the dot is on the right side and the border stays still"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-wrong"
text = "If it was wrong, the weights move. Say Mario was low and falling fast, and the neuron said not yet, but he landed. His depth, which grows as he gets lower, and his falling speed are both above average, so both weights turn up, each by a small step times its own number: the bigger the number, the bigger the turn."
board = "The wrong dot's two numbers feed the dials: each dial turns up in proportion to its number"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-bias"
text = "The bias turns up one small step too. If he hadn't landed, everything would turn down instead. Either way, that moment's total moves toward the side it belongs on, and the border swings a little toward getting that moment right."
board = "The bias dial ticks up; the wrong dot's total climbs toward zero; the border tilts toward the dot"
cite = ["serrano2021", "bishop2006"]

[[section.line]]
id = "rule-name"
text = "That's the perceptron's learning rule, from Frank Rosenblatt's work between nineteen fifty-eight and sixty-two. His Mark One Perceptron machine kept its weights on dials turned by electric motors."
board = "A drawing of the Mark I Perceptron's racks of motor-driven dials, beside the formula's dials"
cite = ["rosenblatt1958", "rosenblatt1962"]

[[section.line]]
id = "passes"
text = "We show it the moments over and over. One trip through all of them, in a shuffled order, is called a pass, and it gets thirty passes."
board = "The dots stream past the border one by one; a counter ticks up passes to thirty"
cite = ["exp002"]

[[section.line]]
id = "step-size"
text = "How small should the step be? Starting from zero, it doesn't matter. A neuron with {bigger_step} times the step makes exactly the same mistakes, so it takes the same nudges, {bigger_step} times bigger. We checked: after every pass, its weights were exactly {bigger_step} times the other's."
spoken = "How small should the step be? Starting from zero, it doesn't matter. A neuron with {bigger_step_spoken} times the step makes exactly the same mistakes, so it takes the same nudges, {bigger_step_spoken} times bigger. We checked: after every pass, its weights were exactly {bigger_step_spoken} times the other's."
board = "Two runs side by side, one with {bigger_step} times the step: their dials read {bigger_step} times apart"
cite = ["exp002"]

[[section.line]]
id = "step-size-2"
text = "And as we saw last time, multiplying every weight and the bias by the same positive amount doesn't move the border at all."
board = "The two runs' borders: the same line"
cite = ["exp001"]
pause = 1.0

[[section.line]]
id = "guarantee"
text = "If some straight border puts every yes on one side and every no on the other, the rule is proven to stop, after a limited number of mistakes."
board = "A border that splits two colours cleanly; the rule's border twitches a few times and stops on it"
cite = ["novikoff1962"]

[[section.line]]
id = "guarantee-check"
text = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a line does split the rest. The rule got every one of them right, and stopped moving after {control_last_moving_pass} passes."
spoken = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a line does split the rest. The rule got every one of them right, and stopped moving after {control_last_moving_pass_spoken} passes."
board = "Mario's map with the best border's wrong dots removed; the border moves for three passes, then stays still, every dot on its side"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "rule-outro"
role = "conclusion"
text = "So we've gone from choosing the border ourselves to a rule that moves it, one mistake at a time. But put the troublemakers back, and no straight border splits Mario's moments."
board = "The removed dots return, overlapping near the border"
cite = ["exp001", "exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "It never settles"

[[section.line]]
id = "never-intro"
role = "intro"
text = "In fact, no border of any shape could get them all right."
board = "Mario's map; a straight border, then a wiggly one, each still leaving wrong dots"
cite = ["exp002"]

[[section.line]]
id = "spots"
text = "The game keeps depth and speed as whole numbers, so the moments it learns from sit on just {spots} spots of Mario's map. At {spots_with_both} of those spots, the very same depth and speed sometimes landed and sometimes didn't."
spoken = "The game keeps depth and speed as whole numbers, so the moments it learns from sit on just {spots_spoken} spots of Mario's map. At {spots_with_both_spoken} of those spots, the very same depth and speed sometimes landed and sometimes didn't."
board = "Mario's map zoomed in: dots stacked on a grid of whole numbers; the spots holding both colours outlined"
cite = ["exp002", "exp001"]
pause = 3.0

[[section.line]]
id = "always-wrong"
text = "So wherever the border goes, some moment is wrong, and the rule moves it again. Every pass has a mistake in it, so the weights never stop changing."
board = "The border nudges at a wrong dot, and a new dot becomes wrong"
cite = ["exp002"]

[[section.line]]
id = "bounded"
text = "Mathematicians proved early on that the weights don't run off without limit, either. They wander, and never settle."
board = "The weights' dials wandering inside a wide ring, never leaving it, never still"
cite = ["minsky1969", "block1970"]

[[section.line]]
id = "exam"
text = "After every pass, we scored it on a recording it never learned from, like an exam it hasn't seen."
board = "A separate recording waits; after each pass, the border is scored on it"
cite = ["exp002"]

[[section.line]]
id = "one-run"
text = "Over its last ten passes, its score kept jumping, from as low as {perceptron_one_run_lowest} to as high as {perceptron_one_run_highest}."
spoken = "Over its last ten passes, its score kept jumping, from as low as {perceptron_one_run_lowest_spoken} to as high as {perceptron_one_run_highest_spoken}."
board = "The border swinging across the map pass after pass; a score bar jumping with it, its ten values listed: {perceptron_one_run}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "order"
text = "So where it ends up is partly luck. Changing only the order of the moments, it ended its thirtieth pass anywhere from {perceptron_lowest} to {perceptron_highest}."
spoken = "So where it ends up is partly luck. Changing only the order of the moments, it ended its thirtieth pass anywhere from {perceptron_lowest_spoken} to {perceptron_highest_spoken}."
board = "Ten final borders from ten orders, scattered; their bars spread from {perceptron_lowest} to {perceptron_highest}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "dropped"
text = "A tiny change does it too. Keeping the order the same, but leaving out just {dropped_moments} of the {train_moments} moments, left it anywhere between {perceptron_dropped_lowest} and {perceptron_dropped_highest}."
spoken = "A tiny change does it too. Keeping the order the same, but leaving out just {dropped_moments_spoken} of the {train_moments_spoken} moments, left it anywhere between {perceptron_dropped_lowest_spoken} and {perceptron_dropped_highest_spoken}."
board = "Thirty dots fade out of sixteen thousand; the final border lands somewhere else"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "who-moves-it"
text = "Looking inside the learning shows who keeps it moving. The moments even the best border gets wrong are only {wrong_for_search} of all the moments, but over its last ten passes, they caused {wrong_share_of_nudges} of the nudges."
spoken = "Looking inside the learning shows who keeps it moving. The moments even the best border gets wrong are only {wrong_for_search_spoken} of all the moments, but over its last ten passes, they caused {wrong_share_of_nudges_spoken} of the nudges."
board = "Each dot sized by how many nudges it caused; the best border's wrong dots, few but large"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "remember"
text = "One cheap fix is to remember: of the lines it ended each pass with, keep the one that did best on the moments it learned from. That scored {pocket_lowest} to {pocket_highest} whatever the order. But that's a patch: the rule itself never stops."
spoken = "One cheap fix is to remember: of the lines it ended each pass with, keep the one that did best on the moments it learned from. That scored {pocket_lowest_spoken} to {pocket_highest_spoken} whatever the order. But that's a patch: the rule itself never stops."
board = "The swinging border, with a still copy left behind where it did best; its bar steady across ten orders"
cite = ["gallant1990", "exp002"]

[[section.line]]
id = "never-outro"
role = "conclusion"
text = "So the perceptron's rule only reacts to mistakes, and its nudges are never any smaller for being nearly right. On Mario's moments, something is always wrong, so it never stops. What would a rule need, to stop?"
board = "The border still swinging, never still"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "How wrong was it?"

[[section.line]]
id = "square-intro"
role = "intro"
text = "The perceptron's rule ignores how wrong a moment was. A barely wrong moment and a wildly wrong one get the same kind of nudge. A different rule asks how far off each moment was. It's known as the Widrow-Hoff rule, and one textbook calls it the square trick."
board = "Two wrong dots, one just over the border and one far over; the same size of nudge for each"
cite = ["widrow1960", "serrano2021"]

[[section.line]]
id = "target"
text = "Give every moment a target for its total: plus one if Mario landed soon, minus one if he didn't. Then after every moment, right or wrong, each weight moves in proportion to three things: a small step, its own number, and how far the total missed the target, in the direction that closes the gap. The bias moves the same way."
board = "The total's dial with a target mark at plus one; the gap between them sets the size and direction of the nudge"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-example"
text = "If a moment's target is plus one and its total was a fifth, it fell short by four fifths, and the weights move up by four fifths of a step times its numbers. A total of three is right, by plenty, but it overshot its target by two, so the weights move back down, two and a half times as hard."
board = "Two totals against the target plus one: 0.2, short by 0.8, pulled up; 3, over by 2, pulled back down; their nudges drawn to scale"
cite = ["widrow1960", "bishop2006"]
pause = 3.0

[[section.line]]
id = "square-why"
text = "Each nudge shrinks that moment's miss. Over all the moments, on average, it shrinks one number: every moment's miss, multiplied by itself, then all added up. Call it the total squared miss. That's where the name square trick comes from."
board = "Each moment's miss drawn as a square, the squares piling up into one total that shrinks as the border moves"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "settles"
text = "Moments that fall short pull the weights one way, and moments that overshoot pull them the other. Near where the total squared miss is lowest, those pulls cancel out, like a tug of war, so added together, they come to nothing."
board = "Pulls from short and overshooting moments drawn as arrows, evening out as the border slides in"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "settles-2"
text = "Single moments still tug. If it learns one moment at a time, its score wobbles, by about {square_swing_points} point."
spoken = "Single moments still tug. If it learns one moment at a time, its score wobbles, by about {square_swing_points_spoken} point."
board = "The border trembling, one moment at a time"
cite = ["exp002"]

[[section.line]]
id = "settles-3"
text = "If it adds up every moment's nudge before taking one step, it comes to rest."
board = "All the nudges added into one; the border still"
cite = ["exp002", "bishop2006"]
pause = 3.0

[[section.line]]
id = "short"
text = "But where it comes to rest is right {batch_square} of the time, not {search}. It and the best border answer differently on {batch_square_disagrees_with_search} of moments."
spoken = "But where it comes to rest is right {batch_square_spoken} of the time, not {search_spoken}. It and the best border answer differently on {batch_square_disagrees_with_search_spoken} of moments."
board = "The square trick's resting border and the best border on the same map; the dots they disagree on lit"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-short"
text = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is past its target. It scored {hinge}: a little closer, but still not the best border. So that isn't the whole reason."
spoken = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is past its target. It scored {hinge_spoken}: a little closer, but still not the best border. So that isn't the whole reason."
board = "A dot deep on its correct side, its pull cut; the border barely moves"
cite = ["exp002"]

[[section.line]]
id = "how-far"
text = "Neither of these two versions counts mistakes. Both add up squared misses, and here, the border with the smallest total lands close to, but not on, the border with the fewest mistakes."
board = "Two borders side by side: one judged by adding up squared misses, one by counting wrong dots"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "square-name"
text = "Bernard Widrow and Ted Hoff published this rule in nineteen sixty. A version of it, for fitting a line through points, is one of three I wrote while learning all this."
board = "The rule's formula beside the perceptron's, with Widrow and Hoff's names and the year"
cite = ["widrow1960", "douglas-linreg"]

[[section.line]]
id = "animals"
text = "Psychologists later described something essentially the same for how animals learn to expect what follows a signal, like food after a sound."
board = "A sound, then food; the same formula beneath"
cite = ["rescorla1972", "sutton1981"]

[[section.line]]
id = "square-outro"
role = "conclusion"
text = "So the square trick settles, in nearly the same place every time, but that place was chosen by the total we gave it, not by the one we wanted. So why not aim straight at the fewest mistakes?"
board = "The two borders, one still and one swinging, side by side"
cite = ["exp002", "bishop2006"]
pause = 1.0

[[section]]
kind = "chapter"
title = "A staircase and a bowl"

[[section.line]]
id = "map-intro"
role = "intro"
text = "To see why not, we need a second map: a map of borders."
board = "Mario's map, with its border; beside it, a blank square labelled 'borders'"
framing = true

[[section.line]]
id = "map-axes"
text = "Picture a border on Mario's map as a ruler laid across it, with a yes side and a no side. You can turn the ruler, all the way round if you like, which swaps its sides, or slide it nearer to or further from the middle. Now picture a flat sheet where every spot is one whole border: moving left or right on the sheet turns the ruler, and moving up or down slides it."
board = "A ruler-like border on Mario's map turning and sliding; a single spot on the border sheet moving to match"
cite = ["exp001", "exp002"]

[[section.line]]
id = "staircase"
text = "Imagine the sheet as ground, with each spot raised to a height: how many mistakes that border makes. Lower is better."
board = "The border sheet rising into ground, each spot lifted by its border's mistakes"
cite = ["exp002"]

[[section.line]]
id = "staircase-2"
text = "The height only changes when the border crosses a moment, so between those crossings it's perfectly flat. The ground is a staircase."
board = "Terraces: flat ledges, sudden drops, a narrow lowest ledge with a cliff along one side"
cite = ["exp002"]

[[section.line]]
id = "big-drops"
text = "And because so many moments share a spot, some of the drops are big: crossing a single spot can change the count by {spot_biggest_change} moments at once."
spoken = "And because so many moments share a spot, some of the drops are big: crossing a single spot can change the count by {spot_biggest_change_spoken} moments at once."
board = "A border crossing one crowded spot; the mistake count jumps"
cite = ["exp002"]

[[section.line]]
id = "no-slope"
text = "Standing on a flat step, every direction looks the same. Only a drop tells you which way is down, and you find it by falling off. So no rule can simply walk down this staircase."
board = "A marker on a ledge, looking every way; all directions level"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "perceptron-score"
text = "The perceptron's rule doesn't walk it either. It has a measure of its own: add up how far its wrong moments sit on the wrong side. With every weight at zero, every total is zero, so no mistake costs anything, and that's its lowest point."
board = "A different picture, of the weights themselves rather than borders: a slope down to a sharp point where every dial reads zero"
cite = ["bishop2006"]

[[section.line]]
id = "perceptron-hover"
text = "So its weights hover close to zero, about {perceptron_nudges_from_zero} nudges away. That close in, each nudge changes the weights by about half their own size, so the border, and the score, keep jumping. And even added together, its pulls never cancel out."
spoken = "So its weights hover close to zero, about {perceptron_nudges_from_zero_spoken} nudges away. That close in, each nudge changes the weights by about half their own size, so the border, and the score, keep jumping. And even added together, its pulls never cancel out."
board = "A marker hopping around the sharp point, never landing"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "bowl"
text = "Now give the border sheet a different height: each border's total squared miss, with the weights that suit that border best. For a border that gets most moments wrong, the best weights are nothing at all, so every total is zero and every miss is one: the ground there is high and flat. Elsewhere, it curves smoothly down into one bowl, with one lowest point."
board = "The same border sheet, now raised by total squared miss: a high flat shelf to one side, and one smooth bowl"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "two-bottoms"
text = "But on the same sheet, the bottom of the bowl and the lowest step are different spots. The border at the bottom of the bowl is right {bowl_bottom} of the time; the one on the lowest step, {stairs_bottom}."
spoken = "But on the same sheet, the bottom of the bowl and the lowest step are different spots. The border at the bottom of the bowl is right {bowl_bottom_spoken} of the time; the one on the lowest step, {stairs_bottom_spoken}."
board = "The two heights on one sheet: the bowl's bottom and the lowest ledge, marked apart"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-bowls"
text = "With two numbers, we could search the staircase ourselves. With many, nobody has a fast way, so learning aims at a measure with a slope instead, and accepts that its lowest point may not be the lowest step."
board = "The staircase fades into fog; the bowl stays clear"
cite = ["hoffgen1995", "bishop2006"]

[[section.line]]
id = "map-outro"
role = "conclusion"
text = "Each rule pays for what it gets. The perceptron's pulls never cancel out, so it can't stop. The square trick's do, so it settles, but slightly off."
board = "The staircase and the bowl side by side, each with its marker"
cite = ["exp002"]

[[section]]
kind = "conclusions"
title = "Conclusions"

[[section.line]]
id = "tldr"
text = "In short: a neuron can learn its own border by moving it after each mistake. On Mario's moments, which no border can split, that rule never settles: it ended anywhere from {perceptron_lowest} to {perceptron_highest}, depending only on the order it saw them."
spoken = "In short: a neuron can learn its own border by moving it after each mistake. On Mario's moments, which no border can split, that rule never settles: it ended anywhere from {perceptron_lowest_spoken} to {perceptron_highest_spoken}, depending only on the order it saw them."
board = "The swinging border and its spread of scores"
cite = ["rosenblatt1962", "exp002"]
pause = 3.0

[[section.line]]
id = "tldr-2"
text = "Nudging to shrink the total squared miss instead settles, at {batch_square}, because near the bottom of its bowl the pulls cancel out. Fewest mistakes would be better, but it's a staircase with no slope to follow, so the square trick stops short of the best border's {search}."
spoken = "Nudging to shrink the total squared miss instead settles, at {batch_square_spoken}, because near the bottom of its bowl the pulls cancel out. Fewest mistakes would be better, but it's a staircase with no slope to follow, so the square trick stops short of the best border's {search_spoken}."
board = "The staircase and the bowl, their lowest points apart"
cite = ["widrow1960", "exp002"]
pause = 3.0

[[section.line]]
id = "inside"
text = "So even for one neuron, what it learned depends on how it learned, and on the moments it was shown. The perceptron's border is one of many it could have ended on. The square trick's is nearly the same every time, but it's the answer to the total we gave it."
board = "The fan of perceptron borders from many runs; the square trick's single still border among them"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "next"
text = "Next time: when the line lies. Data that breaks the assumptions a single neuron quietly makes, including one byte that lets it cheat."
board = "The border on a new map, with a suspiciously perfect split"
framing = true

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
closing = true
