title = "002: Every mistake moves the line"

# Draft 15 (Claude, 2026-11-02), after council round 5; draft 14 answered
# round 4, the first on the scrolling question. Draft 13 rewrote 002 on new data after Nate's
# interview: the landing question's numbers pointed the wrong way (depth
# grows downward, rising is negative, standardizing made below-average
# numbers negative), so the nudges were sign puzzles. Now: will the
# screen start to move soon, from Mario's position and speed, both never
# negative, bigger meaning sooner, not standardized.
# Spine (Nate): the perceptron's rule only reacts to mistakes, and its
# pulls never cancel, so it never stops; the square trick shrinks the
# total squared miss, its pulls cancel, and it settles near the
# fewest-mistakes border but not on it; fewest mistakes is a staircase.
# Words: "the mark" is where the screen starts to follow Mario; "line"
# and "border" are only ever the neuron's. Stairs have "ledges"; "step"
# is the size of a nudge, or one added-up move; a "point" is a place on
# Mario's map, never a share of a score; the "ruler" is a border.

[[section]]
kind = "introduction"
title = "Introduction"

[[section.line]]
id = "about"
text = "This is a series about what really goes on inside neural networks, worked out on games for the Nintendo Entertainment System."
board = "The series' NES, then Super Mario Bros. on its screen"
framing = true

[[section.line]]
id = "last-time"
text = "Last time, we built an artificial neuron that read two numbers from the game's memory, put them on a map, one dot per moment, and answered a yes-or-no question with a straight border across that map."
board = "001's landing map: dots, and a straight border across it"
cite = ["exp001"]

[[section.line]]
id = "last-time-2"
text = "We chose that border ourselves, by trying every one we could and keeping the best."
board = "Borders sweep across the map, one after another; the best one stays"
cite = ["exp001"]

[[section.line]]
id = "the-line"
text = "This time, we need a new question. In Super Mario Bros., the screen doesn't follow Mario until he's {line_blocks} blocks from its left edge. Call that the mark. Until he reaches it, he walks across a screen that stays still."
spoken = "This time, we need a new question. In Super Mario Bros., the screen doesn't follow Mario until he's {line_blocks_spoken} blocks from its left edge. Call that the mark. Until he reaches it, he walks across a screen that stays still."
board = "Mario walking right across a still screen; a faint mark five blocks in; as he reaches it, the screen starts to move"
cite = ["smbdis", "exp002"]

[[section.line]]
id = "question"
text = "So the question is: while he's short of the mark, will the screen start to move within the next half second?"
board = "Mario short of the mark, the question beside him, a half-second timer"
cite = ["exp002"]

[[section.line]]
id = "test-question"
text = "It's only a test question. Knowing the answer wouldn't help anyone play. Its value is that the recording shows whether the screen moved, so every answer the neuron gives can be checked."
board = "The recording scrubs half a second ahead; the screen moves, and a tick appears"
cite = ["exp002"]

[[section.line]]
id = "numbers"
text = "The neuron reads two numbers: how far right Mario is on the screen, counted in blocks, and how fast he's moving right, in pixels each frame. The further right he is, and the faster he's going, the sooner he'll reach the mark."
board = "Mario with two readouts: blocks from the left edge, and pixels a frame; both grow as he walks right and speeds up"
cite = ["datacrystal-smb1", "smbdis"]

[[section.line]]
id = "numbers-2"
text = "A frame is a sixtieth of a second. Walking, he tops out at one and a half pixels a frame; running, with the B button held, at two and a half."
board = "The speed readout climbing to 1.5 as he walks, then to 2.5 as B is held"
cite = ["smbdis", "exp002"]

[[section.line]]
id = "only-these"
text = "We only ask while he isn't walking left. Walking left, the screen can't move until he turns round, so we leave those moments out."
board = "Mario turning to walk left; the question fades out"
cite = ["smbdis", "exp002"]

[[section.line]]
id = "the-map"
text = "On a map with how far right he is along the bottom and his speed up the side, each moment is a dot, coloured by whether the screen moved soon after. The moments come from last time's random player: a program pressing buttons at random, mostly heading right."
board = "The new map: position along the bottom, speed up the side; dots coloured by whether the screen moved soon; beside it, footage of the random player"
cite = ["exp001", "exp002"]

[[section.line]]
id = "search"
text = "When we tried every border, as last time, the best one was right {search} of the time, on recordings it wasn't chosen from. Always saying yes would be right {scrolls_soon_rate} of the time."
spoken = "When we tried every border, as last time, the best one was right {search_spoken} of the time, on recordings it wasn't chosen from. Always saying yes would be right {scrolls_soon_rate_spoken} of the time."
board = "Borders sweep across the new map; the best one stays, its bar at {search}, beside a bar for always yes at {scrolls_soon_rate}"
cite = ["exp002"]

[[section.line]]
id = "search-2"
# From search_cut_blocks and search_cut_walking_blocks in numbers.json
# (checked in the run to fit these words).
text = "Roughly: standing still, it waits until he's about four blocks in; at full walking speed, it says yes from about one and a half."
board = "The best border on the map, from about four blocks at standing still down to about one and a half at walking speed; the yes side to its upper right"
cite = ["exp002"]

[[section.line]]
id = "too-many"
text = "Trying every border only works because there were only a few numbers. A neuron reading more of the two thousand and forty-eight numbers in the console's memory would have far too many borders to try."
board = "The map's two axes multiply into a crowd of axes; the sweeping borders blur into too many to draw"
cite = ["exp001", "nesdev-memory"]

[[section.line]]
id = "no-fast-way"
text = "And in general, no known method finds the border with the fewest mistakes quickly."
board = "A clock spinning beside the crowd of borders"
cite = ["hoffgen1995"]

[[section.line]]
id = "learn"
text = "So this time, the neuron finds its own border. It starts with its weights and its bias all at zero, the weights being how much each number counts, and moves them every time it makes a mistake."
board = "The formula's dials all at zero; then a border appears on the map and twitches toward a wrong dot"
cite = ["rosenblatt1962", "exp002"]

[[section.line]]
id = "this-video"
text = "This video watches that happen, and finds out why the neuron's rule never settles down, what a rule would need in order to stop, and why a second rule, which does stop, stops just short of the best border."
board = "The twitching border, never still"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "Every mistake moves the line"

[[section.line]]
id = "rule-intro"
role = "intro"
text = "First, the rule. Remember how the neuron works: it multiplies each number by a weight and adds them up, along with the bias. If that total is above zero, it says yes."
board = "The formula from 001: position and speed into their dials, the bias, the total against zero"
cite = ["exp001", "bishop2006"]

[[section.line]]
id = "one-at-a-time"
text = "Now it sees one moment at a time, and the recording says whether the screen really moved. If the neuron was right, nothing changes."
board = "One dot lights up on the map; beside it, the recording's verdict; the dot is on the right side and the border stays still"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-wrong"
text = "If it was wrong, the weights move. Say Mario was four blocks in, walking at one pixel a frame, and the neuron said no, but the screen moved. Both weights turn up, each by a fixed step times its own number: the bigger the number, the bigger the turn."
board = "An example dot (not a recorded moment) at 4 and 1 feeds the dials: each dial turns up in proportion to its number, the position dial four times as far"
cite = ["rosenblatt1962", "serrano2021"]
pause = 3.0

[[section.line]]
id = "rule-bias"
text = "The bias turns up one step too."
board = "The bias dial ticks up"
cite = ["serrano2021"]
pause = 1.0

[[section.line]]
id = "rule-flip"
text = "If instead it had said yes, and the screen didn't move, everything would turn down."
board = "A dot where the neuron said yes and the screen stayed still; every dial turns down"
cite = ["rosenblatt1962", "serrano2021"]

[[section.line]]
id = "rule-why"
text = "Either way, that moment's total moves toward the side it belongs on, and the border swings toward getting that moment right."
board = "The moment's total, shown as a bar beside the dials, moves toward its side of zero; the border tilts toward the dot"
cite = ["bishop2006"]

[[section.line]]
id = "rule-name"
text = "That's the perceptron's learning rule. Frank Rosenblatt introduced the perceptron in nineteen fifty-eight, and set out this rule by sixty-two."
board = "Rosenblatt's name, with the two years, beside the rule's formula"
cite = ["rosenblatt1958", "rosenblatt1962"]

[[section.line]]
id = "mark-one"
text = "His Mark One Perceptron machine kept its weights in knobs turned by electric motors."
board = "A drawing of the Mark I Perceptron's racks of motor-turned knobs, beside the formula's dials"
cite = ["rosenblatt1962"]

[[section.line]]
id = "passes"
text = "We show it the moments over and over. One trip through all of them, in a shuffled order, is called a pass, and it gets thirty passes."
board = "The dots stream past the border one by one; a counter ticks up passes to thirty"
cite = ["exp002"]

[[section.line]]
id = "step-size-2"
text = "You might think a bigger step means faster learning. For this rule, with a fixed step, starting from zero, it changes nothing. Its weights are only its nudges, added up, so doubling the step doubles every weight and the bias. Remember from last time: that doesn't move the border at all."
board = "One border, its dials doubled, then halved: the border doesn't move"
cite = ["exp001", "exp002"]

[[section.line]]
id = "step-size"
text = "So a neuron with {bigger_step} times the step has the same border at every moment, makes exactly the same mistakes, and takes the same nudges, {bigger_step} times bigger. We checked: after every pass, its weights were exactly {bigger_step} times the other's."
spoken = "So a neuron with {bigger_step_spoken} times the step has the same border at every moment, makes exactly the same mistakes, and takes the same nudges, {bigger_step_spoken} times bigger. We checked: after every pass, its weights were exactly {bigger_step_spoken} times the other's."
board = "Two runs side by side, one with {bigger_step} times the step: their dials read {bigger_step} times apart, their borders the same"
cite = ["exp002"]

[[section.line]]
id = "guarantee"
text = "If some straight border puts every yes on one side and every no on the other, the rule is proven to stop, after a limited number of mistakes. The closer the yes moments come to the no moments, the more mistakes that can take."
board = "Two colours a straight border can split; the rule's border twitches a few times and stops on one that splits them"
cite = ["novikoff1962"]

[[section.line]]
id = "guarantee-check"
text = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a straight border does split the rest. Given as many passes as it needed, the rule got every one of them right, and stopped moving after {control_last_moving_pass} passes."
spoken = "We checked that on Mario, to see the rule at its best. We removed the troublemakers, the moments the best border gets wrong, so that a straight border does split the rest. Given as many passes as it needed, the rule got every one of them right, and stopped moving after {control_last_moving_pass_spoken} passes."
board = "Mario's map with the best border's wrong dots removed; the border moves for {control_last_moving_pass} passes, then stays still, every dot on its side"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "rule-outro"
role = "conclusion"
text = "So we've gone from choosing the border ourselves to a rule that moves it, one mistake at a time. But put the troublemakers back, and no straight border splits Mario's moments."
board = "The removed dots return, overlapping near the border"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "It never settles"

[[section.line]]
id = "never-intro"
role = "intro"
text = "In fact, no border of any shape could get them all right."
board = "Mario's map; a straight border, then a wiggly one, each still leaving wrong dots"
cite = ["exp002"]

[[section.line]]
id = "spots"
text = "The two numbers come in whole units of the game's own, like a clock that only shows whole minutes, so the moments sit on just {spots} points of the map. At {spots_with_both} of those points, the very same two numbers sometimes led to the screen moving, and sometimes didn't."
spoken = "The two numbers come in whole units of the game's own, like a clock that only shows whole minutes, so the moments sit on just {spots_spoken} points of the map. At {spots_with_both_spoken} of those points, the very same two numbers sometimes led to the screen moving, and sometimes didn't."
board = "Mario's map zoomed in: dots stacked on a grid; the points holding both colours outlined"
cite = ["exp002", "datacrystal-smb1"]
pause = 3.0

[[section.line]]
id = "unseen"
text = "One reason is that the neuron can't see what the random player will press next. When the best border wrongly said yes, the player held the Right button for only {right_ahead_false_yes} of the next half second; when it correctly said yes, {right_ahead_true_yes}."
spoken = "One reason is that the neuron can't see what the random player will press next. When the best border wrongly said yes, the player held the Right button for only {right_ahead_false_yes_spoken} of the next half second; when it correctly said yes, {right_ahead_true_yes_spoken}."
board = "Two Marios at the same point: one keeps holding Right and reaches the mark, one lets go and stops short"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "always-wrong"
text = "So what does the rule do, when something is always wrong? Wherever the border goes, some moment is wrong, and the rule moves it again. Every pass has a mistake in it, so the weights never stop changing."
board = "The border nudges at a wrong dot, and a new dot becomes wrong"
cite = ["exp002"]

[[section.line]]
id = "who-moves-it"
text = "The troublemakers are only {wrong_for_search} of the moments, but in a typical run's last ten passes, they caused about {wrong_share_of_nudges} of its nudges: moment for moment, far more than their share."
spoken = "The troublemakers are only {wrong_for_search_spoken} of the moments, but in a typical run's last ten passes, they caused about {wrong_share_of_nudges_spoken} of its nudges: moment for moment, far more than their share."
board = "Each dot sized by how many nudges it caused; the troublemakers, few but large"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "bounded"
text = "Later, mathematicians proved that the weights stay within limits. With mistakes that never run out, they wander inside them, and never settle."
board = "The weights' dials wandering inside a ring, never leaving it, never still"
cite = ["minsky1969", "block1970"]

[[section.line]]
id = "exam"
text = "After every pass, we scored it on recordings it never learned from, like an exam it hasn't seen."
board = "Separate recordings wait; after each pass, the border is scored on them"
cite = ["exp002"]

[[section.line]]
id = "one-run"
text = "Over its last ten passes, its score kept jumping, as high as {perceptron_one_run_highest}, and on its very last pass, down to {perceptron_one_run_lowest}."
spoken = "Over its last ten passes, its score kept jumping, as high as {perceptron_one_run_highest_spoken}, and on its very last pass, down to {perceptron_one_run_lowest_spoken}."
board = "The border swinging across the map pass after pass; a score bar jumping with it, its ten values listed: {perceptron_one_run}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "order"
text = "So where it ends up is partly luck. We ran it in ten different orders of the same moments, the one we followed among them. All but one ended their thirtieth pass between {perceptron_second_lowest} and {perceptron_highest}; the one we followed was the one that fell to {perceptron_lowest}."
spoken = "So where it ends up is partly luck. We ran it in ten different orders of the same moments, the one we followed among them. All but one ended their thirtieth pass between {perceptron_second_lowest_spoken} and {perceptron_highest_spoken}; the one we followed was the one that fell to {perceptron_lowest_spoken}."
board = "Ten final borders from ten orders, scattered; their bars, nine between {perceptron_second_lowest} and {perceptron_highest}, one at {perceptron_lowest}"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "dropped"
text = "A tiny change to the moments moves it too. Leaving out just {dropped_moments} moments of more than ten thousand, a different {dropped_moments} each time, moved its final score anywhere from {perceptron_dropped_lowest} to {perceptron_dropped_highest}."
spoken = "A tiny change to the moments moves it too. Leaving out just {dropped_moments_spoken} moments of more than ten thousand, a different {dropped_moments_spoken} each time, moved its final score anywhere from {perceptron_dropped_lowest_spoken} to {perceptron_dropped_highest_spoken}."
board = "Thirty dots fade out of ten thousand; the final border lands somewhere else, ten times"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "remember"
text = "One cheap fix is to remember. After each pass, we kept its border if it beat every earlier one on the moments it learned from: a version of the pocket algorithm. Over the ten orders, that scored {pocket_lowest} to {pocket_highest}. But that's the rule plus a memory; the rule itself still never settles."
spoken = "One cheap fix is to remember. After each pass, we kept its border if it beat every earlier one on the moments it learned from: a version of the pocket algorithm. Over the ten orders, that scored {pocket_lowest_spoken} to {pocket_highest_spoken}. But that's the rule plus a memory; the rule itself still never settles."
board = "The swinging border, with a still copy left behind where it did best; its bar steady across ten orders"
cite = ["gallant1990", "exp002"]

[[section.line]]
id = "shrink"
text = "Another fix is to shrink the step after every moment, in step with how many moments it has seen. That calmed it almost completely. Shrinking it only once a pass didn't. Either way, that's a schedule we'd impose on the rule, not the rule itself."
board = "The step drawn as a bar, shrinking after every moment; the border slowing to a stop; beside it, a bar shrinking once a pass, its border still swinging"
cite = ["robbins1951", "exp002"]

[[section.line]]
id = "never-outro"
role = "conclusion"
text = "So the perceptron's rule only reacts to mistakes, and its nudges are never any smaller for being nearly right. On Mario's moments, something is always wrong, so it never stops. What would a rule itself need, to stop?"
board = "The border still swinging, never still"
cite = ["exp002"]
pause = 1.0

[[section]]
kind = "chapter"
title = "How wrong was it?"

[[section.line]]
id = "square-intro"
role = "intro"
text = "The perceptron's rule ignores how wrong a moment was: a moment just past the border on the wrong side and one far past it get the same kind of nudge, sized only by their numbers. A different rule asks how far off each moment was, so its pulls can shrink as it gets closer."
board = "Two wrong dots, one just past the border and one far past; each nudge sized by the dot's numbers, not by how far past it is"
cite = ["rosenblatt1962", "widrow1960"]

[[section.line]]
id = "target"
text = "Give every moment a target for its total: plus one if the screen moved soon, minus one if it didn't. The neuron still says yes above zero; plus one sits above zero, and minus one below."
board = "The total's dial with a target mark at plus one, and another dial with its mark at minus one"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-rule"
text = "Then after every moment, right or wrong, each weight moves in proportion to three things: a small step, its own number, and how far the total missed its target. If the total was below its target, it's pulled up; if above, down. The bias moves the same way."
board = "The gap between total and target sets the size and direction of the nudge to each dial: below the target, up; above it, down"
cite = ["widrow1960", "bishop2006"]
pause = 3.0

[[section.line]]
id = "target-example"
text = "If a moment's target is plus one and its total was a fifth, it's below by four fifths, so each weight moves up four fifths as far as a perceptron mistake would move it, for the same step."
board = "A total of 0.2 against the target plus one: below by 0.8, pulled up"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "target-over"
text = "A total of three is right, by plenty. But it's above its target by two, so the weights move back down, twice as far as a perceptron mistake would. It gets corrected for being too right."
board = "A total of 3 against the same target: above by 2, pulled back down; beside the first, the two nudges drawn to scale"
cite = ["widrow1960", "bishop2006"]
pause = 3.0

[[section.line]]
id = "square-why"
text = "Each nudge shrinks that moment's miss. Added up over all the moments, the nudges shrink one number: every moment's miss, multiplied by itself, then all added up. Call it the total squared miss."
board = "Each moment's miss drawn as a square, the squares piling up into one total that shrinks as the border moves"
cite = ["widrow1960", "bishop2006"]

[[section.line]]
id = "square-why-2"
text = "Squaring makes falling short and overshooting count alike, and makes big misses count more."
board = "A miss short and a miss over, the same size, making the same square; a miss twice as big making a square four times as large"
cite = ["bishop2006"]

[[section.line]]
id = "square-name"
text = "This rule is known as the Widrow-Hoff rule, or least mean squares: Bernard Widrow and Ted Hoff published it in nineteen sixty. One textbook, using it to fit lines through points, calls it the square trick."
board = "The rule's formula beside the perceptron's, with Widrow and Hoff's names and the year"
cite = ["widrow1960", "bishop2006", "serrano2021"]

[[section.line]]
id = "downhill"
text = "Picture the total squared miss as ground over every possible setting of the weights and bias. Change just one weight and follow the ground: it falls, bottoms out, and rises again, a U. Added up over all the moments, the square trick's nudges always point downhill on that ground. That's what we'll call following a slope."
board = "Ground over the dials' settings, shown as a slice through one dial: a U shape; the added-up nudge an arrow pointing down it"
cite = ["bishop2006"]

[[section.line]]
id = "balance"
text = "Each moment's pull shrinks as its total nears its target, which is what the perceptron's pulls never do. At the ground's single lowest point, the pulls cancel and add up to exactly nothing, like a tug of war at a standstill."
board = "Arrows from every moment, each shrinking as its total nears its mark; at the bottom of the U, they add to nothing"
cite = ["bishop2006", "exp002"]

[[section.line]]
id = "settles-2"
text = "Single moments still tug. If it learns one moment at a time, its score still wobbles over its last ten passes, by about {square_swing_points} percent; the perceptron's typically swung by {perceptron_swing_points}."
spoken = "Single moments still tug. If it learns one moment at a time, its score still wobbles over its last ten passes, by about {square_swing_points_spoken} percent; the perceptron's typically swung by {perceptron_swing_points_spoken}."
board = "The border trembling, one moment at a time; beside it, the perceptron's border swinging much further"
cite = ["exp002"]

[[section.line]]
id = "settles-3"
text = "If it adds up every moment's nudge first, then takes one small step, it comes to rest."
board = "All the nudges added into one; the border still"
cite = ["exp002", "bishop2006"]
pause = 3.0

[[section.line]]
id = "too-big"
text = "Here, the size of the step does matter. Too big, and each step jumps clean over the bottom of the U and lands higher up its other side. With {too_big_step} times the step that settled, the total squared miss grew at every one of {too_big_steps} steps, to {too_big_growth} times where it started."
spoken = "Here, the size of the step does matter. Too big, and each step jumps clean over the bottom of the U and lands higher up its other side. With {too_big_step_spoken} times the step that settled, the total squared miss grew at every one of {too_big_steps_spoken} steps, to {too_big_growth_spoken} times where it started."
board = "A ball on the U, each jump crossing the bottom and landing higher up the other side; beside it, the total squared miss climbing. (The step that settled also crosses the bottom along the steepest way, but lands lower each time: don't draw it as a smooth roll.)"
cite = ["exp002", "bishop2006"]
pause = 3.0

[[section.line]]
id = "rest-outro"
role = "conclusion"
text = "So from a rule that only reacts to mistakes, we've come to one that weighs how far off every moment is, and that can come to rest. But where does it rest?"
board = "The square trick's border, still"
cite = ["exp002", "widrow1960"]
pause = 1.0

[[section]]
kind = "chapter"
title = "Close, but not quite"

[[section.line]]
id = "short"
role = "intro"
text = "The square trick comes to rest at a border that is right {batch_square} of the time, not {search}. It and the best border answer differently on {batch_square_disagrees_with_search} of moments."
spoken = "The square trick comes to rest at a border that is right {batch_square_spoken} of the time, not {search_spoken}. It and the best border answer differently on {batch_square_disagrees_with_search_spoken} of moments."
board = "The square trick's resting border and the best border on the same map; the dots they disagree on lit"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-short"
text = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is beyond its target, on its own side. It scored {hinge}: a little closer, but still not the best border. We didn't find the whole reason."
spoken = "Is that because it pulls on moments it already gets right by plenty? We tried a version that stops pulling once a moment is beyond its target, on its own side. It scored {hinge_spoken}: a little closer, but still not the best border. We didn't find the whole reason."
board = "A dot deep on its correct side, its pull cut; the border barely moves"
cite = ["exp002"]

[[section.line]]
id = "how-far"
text = "What we can say is that neither version counts mistakes. Both add up squared misses, the second leaving out moments beyond their target, and their lowest points land close to, but not on, the border with the fewest mistakes."
board = "Two borders side by side: one judged by adding up squared misses, one by counting wrong dots"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "square-outro"
text = "So the square trick settles, in nearly the same place every time, but that place was chosen by the squared misses we gave it, not by the count of mistakes we wanted. So why not aim straight at the fewest mistakes?"
board = "The square trick's still border beside the fewest-mistakes border, also still, a gap between them"
cite = ["exp002", "bishop2006", "hoffgen1995"]

[[section.line]]
id = "map-intro"
text = "Here's a picture of what that would take: a sheet of borders."
board = "Mario's map, with its border; beside it, a blank sheet labelled 'borders'"
framing = true
pause = 1.0

[[section.line]]
id = "map-axes"
text = "Picture a border on Mario's map as a ruler laid across it, with a yes side and a no side. You can turn the ruler, and half way round, it's the same line, but saying yes where it said no; or you can slide it nearer to or further from the middle of the map."
board = "A ruler-like border on Mario's map turning, its yes side swapping at half a turn, and sliding"
cite = ["exp001", "exp002"]

[[section.line]]
id = "sheet"
text = "Now picture a flat sheet where every spot is one whole border. One spot is the best border we found. Step right from it and the ruler turns, all the way round by the sheet's right edge; step up and it slides."
board = "A single spot on the border sheet moving, the ruler on Mario's map moving to match; leaving the right edge brings it back on the left"
cite = ["exp001", "exp002"]
pause = 3.0

[[section.line]]
id = "staircase"
text = "Imagine the sheet as ground, with each spot raised to a height: how many mistakes that border makes. Lower is better."
board = "The border sheet rising into ground, each spot lifted by its border's mistakes"
cite = ["exp002"]

[[section.line]]
id = "staircase-2"
text = "The height only changes when the border crosses a moment, so between those crossings it's perfectly flat. The ground is a staircase of flat ledges."
board = "Terraces: flat ledges, sudden drops, a narrow lowest ledge with a cliff along one side"
cite = ["exp002"]

[[section.line]]
id = "big-drops"
text = "And because so many moments share the same position and speed, some of the drops are big. {spot_biggest_change} moments share one point on Mario's map, two and a half blocks in and not moving sideways, where each life starts, so a border crossing it changes its count by all of them at once."
spoken = "And because so many moments share the same position and speed, some of the drops are big. {spot_biggest_change_spoken} moments share one point on Mario's map, two and a half blocks in and not moving sideways, where each life starts, so a border crossing it changes its count by all of them at once."
board = "A border crossing one crowded point, the standing start; the mistake count jumps"
cite = ["exp002"]

[[section.line]]
id = "no-slope"
text = "Standing on a flat ledge, every direction looks the same. Only a drop tells you which way is down, and you find it by falling off. So a rule that follows a slope, like the square trick, can't walk down this staircase."
board = "A marker on a ledge, looking every way; all directions level"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "staircase-outro"
role = "conclusion"
text = "So from a rule that settles slightly off, we've come to the thing we actually want, the count of mistakes, and found a staircase no slope-following rule can walk down. So what is the square trick following, and why does it stop where it does?"
board = "The staircase, and the square trick's border, still, somewhere off its lowest ledge"
cite = ["exp002", "bishop2006"]
pause = 1.0

[[section]]
kind = "chapter"
title = "A bowl"

[[section.line]]
id = "bowl"
role = "intro"
text = "To see where the square trick rests, give the border sheet a different height: each border's total squared miss."
board = "The same border sheet, its height now the total squared miss"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "best-size"
text = "One border can come with bigger or smaller weights: doubling them all doesn't move it. But it does change the squared miss. So each border gets whichever size gives it the least."
board = "One border shown with small, medium and large weights; the size with the least squared miss picked"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "shelf"
text = "Many borders that get most moments wrong do best by shrinking to nothing. Then every total is zero, every moment misses by exactly one, and they all sit at the same height: a high, flat shelf, filling one side of the sheet."
board = "A backwards border shrinking its weights to nothing; its spot on the sheet joining a high flat shelf"
cite = ["exp002"]

[[section.line]]
id = "bowl-2"
text = "Everywhere else on the sheet, the ground curves smoothly down into one bowl, with one lowest point, and that's the border where the square trick comes to rest."
board = "Beside the shelf, one smooth bowl; the square trick's resting border marked at its bottom"
cite = ["exp002", "bishop2006"]

[[section.line]]
id = "two-bottoms"
text = "But on the same sheet, the bottom of the bowl and the lowest ledge are different spots. The border at the bottom of the bowl is right {bowl_bottom} of the time; the one on the lowest ledge, {stairs_bottom}."
spoken = "But on the same sheet, the bottom of the bowl and the lowest ledge are different spots. The border at the bottom of the bowl is right {bowl_bottom_spoken} of the time; the one on the lowest ledge, {stairs_bottom_spoken}."
board = "The two heights on one sheet: the bowl's bottom and the lowest ledge, marked apart"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "why-bowls"
text = "With two numbers, we could search the staircase ourselves. With many, nobody knows a fast way to, so learning aims at a measure with a slope instead."
board = "The staircase fades into fog; the bowl stays clear"
cite = ["hoffgen1995", "bishop2006", "exp002"]

[[section.line]]
id = "perceptron-rest"
text = "And the perceptron? Added up, its wrong moments' pulls always point partly back toward zero, so zero is the only place they could cancel. But at zero, the neuron says no to everything, every moment where the screen moved is wrong, and they push outward. So there's nowhere for its pulls to cancel."
board = "Each wrong dot's arrow on the dials, every one tilted partly back toward zero; at zero, every dot where the screen moved lit as wrong, shoving the dials outward"
cite = ["bishop2006", "exp002"]
pause = 3.0

[[section.line]]
id = "perceptron-wander"
text = "Its weights wander about {perceptron_nudges_from_zero} nudges from zero, but the weight on position only about {position_weight_nudges_from_zero}, so each nudge changes it by about a third, and how much position counts against speed swings with it. That's why its score kept jumping."
spoken = "Its weights wander about {perceptron_nudges_from_zero_spoken} nudges from zero, but the weight on position only about {position_weight_nudges_from_zero_spoken}, so each nudge changes it by about a third, and how much position counts against speed swings with it. That's why its score kept jumping."
board = "The position dial near zero, each nudge a big swing of it; the border tilting back and forth on Mario's map"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "batch"
text = "Adding up all its nudges before each step, as the square trick can, calms it: over its last hundred steps, its score stayed between {batch_perceptron_lowest} and {batch_perceptron_highest}. But it still moved on every one of {batch_perceptron_steps} steps."
spoken = "Adding up all its nudges before each step, as the square trick can, calms it: over its last hundred steps, its score stayed between {batch_perceptron_lowest_spoken} and {batch_perceptron_highest_spoken}. But it still moved on every one of {batch_perceptron_steps_spoken} steps."
board = "All the perceptron's nudges added into one, step after step; the border still moving, its bar steadier"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "map-outro"
role = "conclusion"
text = "So from a staircase no slope can walk down, we've come to a bowl the square trick can slide down, and a perceptron with nowhere to rest. All that's left is to sum up."
board = "The staircase and the bowl side by side, each with its marker"
cite = ["exp002"]

[[section]]
kind = "conclusions"
title = "Conclusions"

[[section.line]]
id = "tldr"
text = "In short: with a steady step, a learning rule can only come to rest where its added-up pulls cancel out. On Mario's moments, which no border can split, the perceptron's pulls never do. In nine orders out of ten it ended between {perceptron_second_lowest} and {perceptron_highest}, and in the tenth, at {perceptron_lowest}."
spoken = "In short: with a steady step, a learning rule can only come to rest where its added-up pulls cancel out. On Mario's moments, which no border can split, the perceptron's pulls never do. In nine orders out of ten it ended between {perceptron_second_lowest_spoken} and {perceptron_highest_spoken}, and in the tenth, at {perceptron_lowest_spoken}."
board = "The swinging border and its spread of scores"
cite = ["rosenblatt1962", "exp002"]
pause = 3.0

[[section.line]]
id = "tldr-2"
text = "The square trick weighs how far off each moment is. Its pulls cancel at the bottom of a bowl. Adding up its nudges before each step, it settles there, at {batch_square}."
spoken = "The square trick weighs how far off each moment is. Its pulls cancel at the bottom of a bowl. Adding up its nudges before each step, it settles there, at {batch_square_spoken}."
board = "The bowl, with the square trick resting at its bottom"
cite = ["widrow1960", "exp002"]
pause = 3.0

[[section.line]]
id = "tldr-3"
text = "Fewest mistakes did better here, but it's a staircase with no slope to follow. So learning aims at a measure with a slope, here a bowl, whose bottom falls short of the lowest ledge's {stairs_bottom}."
spoken = "Fewest mistakes did better here, but it's a staircase with no slope to follow. So learning aims at a measure with a slope, here a bowl, whose bottom falls short of the lowest ledge's {stairs_bottom_spoken}."
board = "The staircase and the bowl, their lowest points apart"
cite = ["exp002", "hoffgen1995"]
pause = 3.0

[[section.line]]
id = "inside"
text = "So even for one neuron, what it learned depends on how it learned. The perceptron's pulls never cancel, so its border is one of many it could have ended on. The square trick's cancel in one place, so its border is nearly the same every time, but that place is set by the total we gave it."
board = "The fan of perceptron borders from many runs; the square trick's single still border among them"
cite = ["exp002"]
pause = 3.0

[[section.line]]
id = "next"
text = "Next time: when the line lies. Data that breaks the assumptions a single neuron quietly makes, including one byte that lets it cheat."
board = "The border on a new map, with a suspiciously perfect split"
framing = true

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
closing = true
