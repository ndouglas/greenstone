title = "001: One neuron draws a line"

# --- Why look inside at all ---

[[line]]
id = "memory"
text = "A Nintendo Entertainment System runs its games out of a small working memory: two thousand and forty-eight numbers, each between zero and two hundred and fifty-five, changing many times a second."
board = "An NES; its 2,048 bytes of work RAM as a grid of numbers, changing as Mario runs"
cite = ["nesdev-memory"]

[[line]]
id = "answer-keys"
text = "Some of those numbers have known meanings: where the player is, how many lives are left, whether he's jumping. That makes old games a good place to study things that learn. When we ask a learning machine a question about a game, the game's own memory holds the right answer."
board = "Three squares in the grid light up with labels: position, lives, jumping"
cite = ["datacrystal-smb1"]

[[line]]
id = "nobody-knows"
text = "The systems we now call artificial intelligence are built from enormous numbers of simple pieces called artificial neurons, loosely inspired by brain cells, and researchers understand very little of what goes on inside them."
board = "A network of dots and lines grows to thousands of dots, too many to follow"
cite = ["bluedot2024", "mcculloch1943"]

[[line]]
id = "doubters"
text = "Some researchers argue that studying these systems one piece at a time is misguided, and that we should study the patterns spread across many pieces instead. We'll give that argument its own video. To weigh it, you need to know what one piece is."
board = "The crowded network shrinks back to a single dot"
cite = ["hendrycks2025"]

[[line]]
id = "start-with-one"
text = "So we'll start with exactly one."
board = "One dot, alone, centre screen"
framing = true

# --- A thermostat ---

[[line]]
id = "thermostat"
text = "Begin with something you already know: a thermostat. It reads one number, the temperature, and compares it with its setting. Below the setting, the heat comes on. Above it, the heat goes off."
board = "A thermometer with a marked setting; the heat icon lights below it, goes dark above it"
framing = true

[[line]]
id = "simplest-neuron"
text = "The oldest and simplest kind of artificial neuron does the same thing: it takes in a number, compares it with a setting, and answers yes or no."
board = "The thermometer becomes a number line with one cut; yes on one side, no on the other"
cite = ["mcculloch1943"]

# --- Mario ---

[[line]]
id = "question"
text = "Here's a question about Super Mario Bros.: is Mario in the air right now?"
board = "Super Mario Bros. footage; Mario jumps, lands, runs"
framing = true

[[line]]
id = "answer-key"
text = "The game already knows. One number in its memory is zero while Mario is on the ground, one while he's in the air from a jump, and two while he's falling after walking off a ledge. One and two both mean: in the air."
board = "One square of the memory grid lights up and ticks between 0, 1 and 2 as Mario jumps and lands"
cite = ["datacrystal-smb1"]

[[line]]
id = "never-see"
text = "That number is our answer key. We'll use it to check the neuron, and to choose its setting, but the neuron itself never gets to read it."
board = "The answer-key square gets a padlock; a line from it runs to a scorecard, not to the neuron"
framing = true

[[line]]
id = "height"
text = "Instead, the neuron reads a different number: Mario's height number, which says how far down the screen he is. The NES counts from the top, so a bigger height number means lower down."
board = "A ruler down the left of the screen, zero at the top; a marker follows Mario"
cite = ["datacrystal-smb1", "nesdev-oam"]

[[line]]
id = "recording"
text = "To get examples, we had a program play the first level, pressing random buttons for random lengths of time, starting over every time Mario died, which was about every {smb1_seconds_between_deaths} seconds. We recorded three five-minute sessions, sixty frames a second, and kept the memory from every frame."
spoken = "To get examples, we had a program play the first level, pressing random buttons for random lengths of time, starting over every time Mario died, which was about every {smb1_seconds_between_deaths_spoken} seconds. We recorded three five-minute sessions, sixty frames a second, and kept the memory from every frame."
board = "Fast-forwarded footage of the random player, dying and restarting; three tapes labelled 1, 2, 3"
cite = ["exp001"]

[[line]]
id = "choosing"
text = "Then we tried every possible setting for the height number on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut}: exactly Mario's height number when he's standing on the ground."
spoken = "Then we tried every possible setting for the height number on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut_spoken}: exactly Mario's height number when he's standing on the ground."
board = "A cut sweeps down the screen; a score for each position; it settles at Mario's feet on the ground"
cite = ["exp001"]

[[line]]
id = "the-neuron"
text = "So our neuron is: if Mario's height number is less than {smb1_height_cut}, meaning he's higher than the ground, answer \"in the air\". Otherwise, answer \"on the ground\"."
spoken = "So our neuron is: if Mario's height number is less than {smb1_height_cut_spoken}, meaning he's higher than the ground, answer in the air. Otherwise, answer on the ground."
board = "The cut across the screen at ground level; above it is marked 'in the air'"
cite = ["exp001"]

[[line]]
id = "baseline"
text = "Before we test it, the score to beat. In the third session, the one the neuron hadn't been tuned on, Mario was on the ground a little more than half the time, so a neuron that always said \"on the ground\" would be right {smb1_baseline} of the time."
spoken = "Before we test it, the score to beat. In the third session, the one the neuron hadn't been tuned on, Mario was on the ground a little more than half the time, so a neuron that always said on the ground would be right {smb1_baseline_spoken} of the time."
board = "A bar for 'always on the ground' at 55%"
cite = ["exp001"]

[[line]]
id = "result"
text = "Our one-number neuron is right {smb1_height_accuracy} of the time."
spoken = "Our one-number neuron is right {smb1_height_accuracy_spoken} of the time."
board = "A second bar at 94%, beside the first"
cite = ["exp001"]

[[line]]
id = "its-mistakes"
text = "{smb1_mistakes_on_ground_above_floor} of its mistakes come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but higher up, so the neuron says he's in the air."
spoken = "{smb1_mistakes_on_ground_above_floor_spoken} of its mistakes come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but higher up, so the neuron says he's in the air."
board = "Mario standing on a pipe; the cut line is below his feet; the neuron's answer flashes 'in the air' in error"
cite = ["exp001"]

# --- Weight and bias ---

[[line]]
id = "why-weights"
text = "A thermostat can only ever read one number. To let a neuron read more than one, each number it reads gets a multiplier of its own, called a weight."
board = "The neuron box: one input, then a second input slot appears, each with a multiplier"
cite = ["goodfellow2016"]

[[line]]
id = "recipe"
text = "Here's the full recipe. Take each input, x, and multiply it by its weight, w. Add up the results. Add one more number, called the bias, b. If the total is above zero, the answer is yes."
board = "x, w and b each appear and are labelled in turn; the total, and a light for yes"
cite = ["goodfellow2016", "mcculloch1943"]

[[line]]
id = "formula"
text = "With one input, that's w·x + b > 0."
spoken = "With one input, that's: w times x, plus b, is above zero."
board = "w·x + b > 0 assembles, w in orange, x in blue, b in purple"
cite = ["goodfellow2016"]

[[line]]
id = "bias-is-setting"
text = "The bias does the job the thermostat's setting did. Instead of comparing with a setting, the neuron adds the bias and compares with zero."
board = "The thermostat's setting slides over and becomes the b in the formula"
cite = ["goodfellow2016"]

[[line]]
id = "our-numbers"
text = "For our Mario neuron, the weight is minus one and the bias is {smb1_height_cut}. The weight is negative because a smaller height number means higher up. If Mario's height number is 150: minus 150, plus {smb1_height_cut}, makes 26. That's above zero, so: in the air. If it's 180: minus 180, plus {smb1_height_cut}, makes minus 4. That's below zero, so: on the ground."
spoken = "For our Mario neuron, the weight is minus one and the bias is {smb1_height_cut_spoken}. The weight is negative because a smaller height number means higher up. If Mario's height number is a hundred and fifty: minus a hundred and fifty, plus {smb1_height_cut_spoken}, makes twenty-six. That's above zero, so: in the air. If it's a hundred and eighty: minus a hundred and eighty, plus {smb1_height_cut_spoken}, makes minus four. That's below zero, so: on the ground."
board = "The formula with -1 and 176 filled in; the two worked examples, one above the cut and one below"
framing = true

[[line]]
id = "balance"
text = "You can picture it as a balance scale, with a yes pan and a no pan. Each input, times its weight, is a block. A positive result goes in the yes pan, and a negative one in the no pan. The bias is one more block, in whichever pan its sign says. The neuron says yes when the yes pan is heavier."
board = "The balance-scale sketch with labelled yes and no pans"
framing = true

[[line]]
id = "balance-mario"
text = "For Mario at 150, the height block weighs 150, in the no pan, because its weight is negative. The bias block weighs {smb1_height_cut}, in the yes pan. The yes pan is heavier, so the scale tips to yes: in the air."
spoken = "For Mario at a hundred and fifty, the height block weighs a hundred and fifty, in the no pan, because its weight is negative. The bias block weighs {smb1_height_cut_spoken}, in the yes pan. The yes pan is heavier, so the scale tips to yes: in the air."
board = "A 150 block drops into the no pan, a 176 block into the yes pan; the scale tips to yes"
framing = true

# --- Two numbers that both matter ---

[[line]]
id = "new-question"
text = "Now a question that needs two numbers. While Mario is in the air: will he land in the next {smb1_land_within} frames, a sixth of a second?"
spoken = "Now a question that needs two numbers. While Mario is in the air: will he land in the next {smb1_land_within_spoken} frames, a sixth of a second?"
board = "Mario mid-jump, a timer counting ten frames ahead"
cite = ["exp001"]

[[line]]
id = "two-inputs"
text = "This neuron reads his height number and a second number from his memory: how fast he's moving up or down. That speed number is negative while he rises and positive while he falls, again because the NES counts downward."
board = "A second memory square lights up, negative as Mario rises, positive as he falls"
cite = ["datacrystal-smb1"]

[[line]]
id = "land-baseline"
text = "Mario is usually still in the air ten frames later, so always answering \"no\" is right {smb1_land_baseline} of the time. A single cut on his height does no better, at {smb1_land_height_cut_accuracy}. A single cut on his speed gets {smb1_land_speed_cut_accuracy}."
spoken = "Mario is usually still in the air ten frames later, so always answering no is right {smb1_land_baseline_spoken} of the time. A single cut on his height does no better, at {smb1_land_height_cut_accuracy_spoken}. A single cut on his speed gets {smb1_land_speed_cut_accuracy_spoken}."
board = "Three bars: 75%, 75%, 84%"
cite = ["exp001"]

[[line]]
id = "land-line"
text = "Using both numbers, each with its own weight, the neuron gets {smb1_land_line_accuracy}."
spoken = "Using both numbers, each with its own weight, the neuron gets {smb1_land_line_accuracy_spoken}."
board = "A fourth bar at 91%"
cite = ["exp001"]

[[line]]
id = "the-picture"
text = "Here's what that neuron looks like. Draw every moment Mario was in the air as a dot on a sheet of paper: his height number along the bottom, his speed up the side. The moments just before a landing gather toward one corner: low down, and falling fast."
board = "The real scatter: height across, speed up; dots coloured by 'landed within 10 frames'"
cite = ["exp001"]

[[line]]
id = "the-border"
text = "The neuron's yes and no meet along a straight line across that sheet, a border. On one side of it, the neuron says \"lands soon\"; on the other, \"not yet\"."
spoken = "The neuron's yes and no meet along a straight line across that sheet, a border. On one side of it, the neuron says lands soon; on the other, not yet."
board = "The border drawn across the scatter; one side shaded 'lands soon'"
framing = true

[[line]]
id = "the-tilt"
text = "The border is tilted, because the two numbers trade off against each other. The higher Mario is, the faster he has to be falling to land in time. A bit lower can make up for a bit slower."
board = "A dot slides along the border: lower and slower, higher and faster, all on the line"
cite = ["exp001"]

[[line]]
id = "school"
text = "If you remember y = mx + b from school, this border is the same kind of straight line. How steeply it tilts comes from how the two weights compare, and the bias moves it without changing its tilt. The letters don't line up one for one, but the idea does."
spoken = "If you remember y equals m x plus b from school, this border is the same kind of straight line. How steeply it tilts comes from how the two weights compare, and the bias moves it without changing its tilt. The letters don't line up one for one, but the idea does."
board = "The border tilts as one weight changes; then slides, keeping its tilt, as the bias changes"
cite = ["openstax-linear"]

[[line]]
id = "scale-again"
text = "On the balance scale, it's the same picture: the height block and the speed block both go on, each scaled by its weight, and a landing is coming when together they outweigh the bias."
board = "The scale with two input blocks and the bias, tipping as Mario's two numbers change"
framing = true

# --- Other games ---

[[line]]
id = "other-games"
text = "Back to the first question, in the air or not, in two other games."
board = "Super Mario Bros. 3 and Castlevania footage side by side"
framing = true

[[line]]
id = "smb3"
text = "In Super Mario Bros. 3, the same kind of neuron, with its own setting, also lands on the height of the ground, {smb3_height_cut} in that game's numbers. It's right {smb3_height_accuracy} of the time, where always guessing \"on the ground\" gets {smb3_baseline}."
spoken = "In Super Mario Bros. 3, the same kind of neuron, with its own setting, also lands on the height of the ground, {smb3_height_cut_spoken} in that game's numbers. It's right {smb3_height_accuracy_spoken} of the time, where always guessing on the ground gets {smb3_baseline_spoken}."
board = "Super Mario Bros. 3: the cut at the ground; two bars, 50% and 87%"
cite = ["datacrystal-smb3", "exp001"]

[[line]]
id = "castlevania"
text = "In Castlevania, you play Simon, a monster hunter with a whip. A number in memory says whether he's jumping, falling, or being knocked backwards through the air. A neuron with one setting on his height gets {castlevania_height_accuracy}, where always guessing \"on the ground\" gets {castlevania_baseline}."
spoken = "In Castlevania, you play Simon, a monster hunter with a whip. A number in memory says whether he's jumping, falling, or being knocked backwards through the air. A neuron with one setting on his height gets {castlevania_height_accuracy_spoken}, where always guessing on the ground gets {castlevania_baseline_spoken}."
board = "Castlevania: the cut at Simon's feet; two bars, 67% and 92%"
cite = ["datacrystal-cv", "exp001"]

[[line]]
id = "castlevania-arc"
text = "Castlevania keeps Simon's jump differently. Instead of a speed, it counts how far through the jump he is, step by step, up to {castlevania_jump_steps}. The number its memory map calls his vertical speed never changed in any of our recordings. So there's no speed number to give a second neuron input. Same question, different numbers."
spoken = "Castlevania keeps Simon's jump differently. Instead of a speed, it counts how far through the jump he is, step by step, up to {castlevania_jump_steps_spoken}. The number its memory map calls his vertical speed never changed in any of our recordings. So there's no speed number to give a second neuron input. Same question, different numbers."
board = "Simon jumping; a step counter ticks 1, 2, 3 … 39 while his height arcs"
cite = ["datacrystal-cv", "exp001"]

# --- Place value ---

[[line]]
id = "score"
text = "The adding-up half of a neuron can do something you already do every day. Super Mario Bros. keeps the score as six separate digits in memory, from millions down to tens."
board = "The score at the top of the screen; six memory squares light up, one per digit"
cite = ["datacrystal-smb1"]

[[line]]
id = "place-value"
text = "Give those digits weights of a million, a hundred thousand, and so on down to ten, and add them up: the total is the score. That's how you read any number written in digits. Add a bias and the comparison with zero, and the same neuron could answer a question like: has Mario scored more than a thousand points?"
board = "Each digit block is multiplied by its place value and goes on the scale; then a bias of -1000 goes in the no pan"
cite = ["datacrystal-smb1"]

# --- The one idea ---

[[line]]
id = "all-of-it"
text = "That's everything inside this neuron: a weight for each input, a bias, and the straight border they draw. We can see all of it, and we know exactly what it does."
board = "The neuron box, the formula and the border, all on screen at once, with nothing hidden"
framing = true

[[line]]
id = "modern"
text = "The artificial neurons in today's systems are close cousins of this one. They start with the same weighted sum and bias, but instead of a bare yes or no, they pass on a number that says how far past the border the input is."
board = "The yes/no light becomes a dial that rises the further past the border a dot sits"
cite = ["goodfellow2016"]

[[line]]
id = "harder"
text = "Networks of thousands of them are much harder to see into than this single neuron. That's what the rest of this series is about."
board = "The single dot, with a crowd of dots waiting faintly behind it"
framing = true

[[line]]
id = "the-idea"
text = "One neuron weighs its inputs, adds them up with a bias, and answers by which side of a straight border the total puts you on."
board = "The border through the scatter, yes on one side, no on the other"
framing = true

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
