title = "001: One neuron draws a line"

# --- Why look inside at all ---

[[line]]
id = "memory"
text = "A Nintendo Entertainment System's main working memory holds two thousand and forty-eight numbers, each between zero and two hundred and fifty-five, changing many times a second while a game runs."
board = "An NES; its 2,048 bytes of work RAM as a grid of numbers, changing as Mario runs"
cite = ["nesdev-memory", "exp001"]

[[line]]
id = "nobody-knows"
text = "The systems we now call artificial intelligence are built from enormous numbers of simple pieces called artificial neurons, loosely inspired by brain cells, and researchers understand very little of what goes on inside them."
board = "A network of dots and lines grows to thousands of dots, too many to follow"
cite = ["goodfellow2016-ch1", "bluedot2024"]

[[line]]
id = "answer-keys"
text = "Old games are a good place to study them, because some numbers in a game's memory have known meanings, like where the player is or whether he's jumping. So when we use a neuron to answer a question about a game, the game's own memory holds the right answer to check it against."
board = "Three squares in the grid light up with labels: position, lives, jumping"
cite = ["datacrystal-smb1"]

[[line]]
id = "doubters"
text = "Some researchers argue that studying these systems one piece at a time is misguided, and that we should study the patterns spread across many pieces instead. We'll give that argument its own video. To weigh it, you need to know what one piece is."
board = "The crowded network shrinks back to a single dot"
cite = ["hendrycks2025"]

[[line]]
id = "start-with-one"
text = "So we'll start with exactly one."
board = "One dot, alone, centre screen"
framing = true

# --- A thermostat ---

[[line]]
id = "thermostat"
text = "Begin with something you already know: picture a simple thermostat. It reads one number, the temperature, and compares it with its setting. Below the setting, the heat comes on. Above it, the heat goes off."
board = "A thermometer with a marked setting; the heat icon lights below it, goes dark above it"
framing = true

[[line]]
id = "simplest-neuron"
text = "The simplest kind of artificial neuron does something similar. It takes in numbers and gives each one a multiplier, called a weight, which says how much that number counts and which way it pushes. It adds them up, compares the total with a setting, and answers yes or no. Given just one number, it works like a thermostat."
board = "The thermometer becomes a number line with one mark; yes on one side, no on the other"
cite = ["goodfellow2016-ch1", "rosenblatt1958"]

# --- Mario: one number ---

[[line]]
id = "question"
text = "Here's a question about Super Mario Bros.: is Mario in the air right now?"
board = "Super Mario Bros. footage; Mario jumps, lands, runs"
framing = true

[[line]]
id = "answer-key"
text = "The game already knows. One number in its memory is zero while Mario is standing on something, one while he's in the air from a jump, and two while he's falling after walking off a ledge. One and two both mean: in the air."
board = "One square of the memory grid lights up and ticks between 0, 1 and 2 as Mario jumps and lands"
cite = ["datacrystal-smb1"]

[[line]]
id = "never-see"
text = "That number is our answer key. We'll use it to check the neuron, and to choose its setting, but the neuron itself never gets to read it."
board = "The answer-key square gets a padlock; a line from it runs to a scorecard, not to the neuron"
cite = ["exp001"]

[[line]]
id = "depth"
text = "Instead, the neuron reads a different number from the game's memory: Mario's depth, meaning how far down the screen he is. The game counts it in dots, starting from a line a little below the top of the screen, so a bigger depth means lower on the screen."
board = "Footage: a line drawn across the screen 32 dots below the top, labelled 0, and a ruler counting down from it to Mario's feet (depth d is screen row d + 32); the ruler's number follows him as he jumps"
cite = ["datacrystal-smb1", "nesdev-oam", "exp001"]

[[line]]
id = "recording"
text = "To get examples, we wrote a program that plays the game by picking buttons at random, mostly running right and often jumping, and starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths} seconds, so everything we recorded comes from the start of the first level."
spoken = "To get examples, we wrote a program that plays the game by picking buttons at random, mostly running right and often jumping, and starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths_spoken} seconds, so everything we recorded comes from the start of the first level."
board = "Fast-forwarded footage of the random player, dying and restarting"
cite = ["exp001"]

[[line]]
id = "frames"
text = "The NES draws about sixty pictures a second, called frames. We recorded three five-minute sessions and kept the game's memory from every frame."
board = "Three tapes labelled 1, 2, 3; a counter of frames ticking up"
cite = ["nesdev-timing", "exp001"]

[[line]]
id = "choosing"
text = "Then we tried every possible setting for the depth on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut}: exactly Mario's depth when he's standing on the floor of the level."
spoken = "Then we tried every possible setting for the depth on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut_spoken}: exactly Mario's depth when he's standing on the floor of the level."
board = "A mark sweeps down the screen, a score for each position; it settles at the floor"
cite = ["exp001"]

[[line]]
id = "the-neuron"
text = "So our neuron is: if Mario's depth is less than {smb1_height_cut}, meaning he's above the floor, answer \"in the air\". Otherwise, answer \"on the ground\"."
spoken = "So our neuron is: if Mario's depth is less than {smb1_height_cut_spoken}, meaning he's above the floor, answer in the air. Otherwise, answer on the ground."
board = "The setting drawn across the screen at the floor; above it is marked 'in the air'"
cite = ["exp001"]

[[line]]
id = "baseline"
text = "Before we test it, the score to beat. We test on the third session, which the setting wasn't chosen on: new play, though on the same stretch of the same level. There, Mario was on the ground a little more than half the time, so always saying \"on the ground\" would be right {smb1_baseline} of the time."
spoken = "Before we test it, the score to beat. We test on the third session, which the setting wasn't chosen on: new play, though on the same stretch of the same level. There, Mario was on the ground a little more than half the time, so always saying on the ground would be right {smb1_baseline_spoken} of the time."
board = "A bar for 'always on the ground' at 55%"
cite = ["exp001"]

[[line]]
id = "result"
text = "Our one-number neuron is right {smb1_height_accuracy} of the time."
spoken = "Our one-number neuron is right {smb1_height_accuracy_spoken} of the time."
board = "A second bar at 94%, beside the first"
cite = ["exp001"]

[[line]]
id = "not-a-fluke"
text = "Testing on a session the setting wasn't chosen on is how we check for a fluke: a lucky fit to the first two sessions would have shown up here. And choosing the setting on any one session by itself lands on {smb1_every_session_cut} every time."
spoken = "Testing on a session the setting wasn't chosen on is how we check for a fluke: a lucky fit to the first two sessions would have shown up here. And choosing the setting on any one session by itself lands on {smb1_every_session_cut_spoken} every time."
board = "Three session strips side by side; each one's own best setting lights up, and all three land on 176"
cite = ["exp001"]

[[line]]
id = "steady-player"
text = "A program that plays more steadily, by fixed rules, picks the same setting too: {smb1_steady_player_cut}. How often each situation comes up depends on the player, but where the floor is doesn't."
spoken = "A program that plays more steadily, by fixed rules, picks the same setting too: {smb1_steady_player_cut_spoken}. How often each situation comes up depends on the player, but where the floor is doesn't."
board = "Footage of the steady player beside the random one; a fourth strip joins the three, its best setting also landing on 176"
cite = ["exp001"]

[[line]]
id = "its-mistakes"
text = "{smb1_mistakes_on_ground_above_floor} of its mistakes come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but above the floor, so the neuron says he's in the air."
spoken = "{smb1_mistakes_on_ground_above_floor_spoken} of its mistakes come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but above the floor, so the neuron says he's in the air."
board = "Mario standing on a pipe; the setting line is below his feet; the neuron's answer flashes 'in the air' in error"
cite = ["exp001"]

[[line]]
id = "other-games"
text = "The same kind of neuron works in other games, each with its own setting, recorded, chosen and tested the same way. In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy} of the time, where always guessing \"on the ground\" gets {smb3_baseline}."
spoken = "The same kind of neuron works in other games, each with its own setting, recorded, chosen and tested the same way. In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy_spoken} of the time, where always guessing on the ground gets {smb3_baseline_spoken}."
board = "Super Mario Bros. 3: the setting at the floor; two bars, 50% and 87%"
cite = ["datacrystal-smb3", "exp001"]

[[line]]
id = "castlevania"
text = "In Castlevania, you play Simon, a monster hunter with a whip, and that game's answer key is a number that says whether he's jumping or being knocked backwards through the air. A neuron reading his depth is right {castlevania_height_accuracy} of the time, where always guessing \"on the ground\" gets {castlevania_baseline}."
spoken = "In Castlevania, you play Simon, a monster hunter with a whip, and that game's answer key is a number that says whether he's jumping or being knocked backwards through the air. A neuron reading his depth is right {castlevania_height_accuracy_spoken} of the time, where always guessing on the ground gets {castlevania_baseline_spoken}."
board = "Castlevania: the setting across the screen; two bars, 67% and 92%"
cite = ["datacrystal-cv", "exp001"]

# --- Weight and bias ---

[[line]]
id = "why-weights"
text = "Weights are what make a neuron more than a thermostat: it can read several numbers at once, each with its own weight, so different numbers can count for different amounts, in different directions."
board = "The neuron box: one input, then a second input slot appears, each with a multiplier"
cite = ["goodfellow2016-ch1"]

[[line]]
id = "recipe"
text = "Here's the full recipe. Take each input, x, and multiply it by its weight, w. Add up the results. Add one more number, called the bias, b. If the total is above zero, the answer is yes."
board = "x, w and b each appear and are labelled in turn; the total, and a light for yes"
cite = ["goodfellow2016-ch1", "goodfellow2016", "bishop2006"]

[[line]]
id = "formula"
text = "With one input, that's w·x + b > 0."
spoken = "With one input, that's: w times x, plus b, is above zero."
board = "w·x + b > 0 assembles, w in orange, x in blue, b in purple"
cite = ["goodfellow2016", "bishop2006"]

[[line]]
id = "bias-is-setting"
text = "The bias takes over the job the thermostat's setting did. Instead of comparing with a setting, the neuron adds the bias and compares with zero."
board = "The thermostat's setting slides over and becomes the b in the formula"
cite = ["goodfellow2016", "bishop2006"]

[[line]]
id = "why-zero"
text = "Why zero? Any fixed number would work. Comparing with 100 would just mean a bias 100 lower. Zero is the custom, so the bias carries the whole setting by itself."
spoken = "Why zero? Any fixed number would work. Comparing with a hundred would just mean a bias a hundred lower. Zero is the custom, so the bias carries the whole setting by itself."
board = "'> 100' on the right of the formula slides across and joins the bias as '- 100', leaving '> 0'"
cite = ["bishop2006"]

[[line]]
id = "our-numbers"
text = "For our Mario neuron, the weight is minus one and the bias is {smb1_height_cut}. The weight is negative because, like the thermostat, its yes is below the setting: at smaller depths. Minus the depth, plus {smb1_height_cut}, is above zero exactly when the depth is less than {smb1_height_cut}: the same test as before, written the neuron's way."
spoken = "For our Mario neuron, the weight is minus one and the bias is {smb1_height_cut_spoken}. The weight is negative because, like the thermostat, its yes is below the setting: at smaller depths. Minus the depth, plus {smb1_height_cut_spoken}, is above zero exactly when the depth is less than {smb1_height_cut_spoken}: the same test as before, written the neuron's way."
board = "The formula with -1 and 176 filled in, beside 'depth < 176'"
cite = ["exp001"]

[[line]]
id = "example-air"
text = "If Mario's depth is 150: minus 150, plus {smb1_height_cut}, makes 26. That's above zero, so: in the air."
spoken = "If Mario's depth is a hundred and fifty: minus a hundred and fifty, plus {smb1_height_cut_spoken}, makes twenty-six. That's above zero, so: in the air."
board = "Mario above the floor; the sum worked through, landing on 26 and a yes"
framing = true

[[line]]
id = "example-ground"
text = "If it's {smb1_height_cut}, standing on the floor: minus {smb1_height_cut}, plus {smb1_height_cut}, makes zero. That's not above zero, so: on the ground."
spoken = "If it's {smb1_height_cut_spoken}, standing on the floor: minus {smb1_height_cut_spoken}, plus {smb1_height_cut_spoken}, makes zero. That's not above zero, so: on the ground."
board = "Mario on the floor; the sum worked through, landing on 0 and a no"
framing = true

[[line]]
id = "school"
text = "If you remember y = mx + b from school, the total is exactly that, with the weight as m and the bias as b. Draw the total against the depth: a straight line that starts at {smb1_height_cut} and drops one for every step of depth. It crosses zero at {smb1_height_cut}, the setting. Where the line is above zero, the answer is \"in the air\". Where it's below, \"on the ground\"."
spoken = "If you remember y equals m x plus b from school, the total is exactly that, with the weight as m and the bias as b. Draw the total against the depth: a straight line that starts at {smb1_height_cut_spoken} and drops one for every step of depth. It crosses zero at {smb1_height_cut_spoken}, the setting. Where the line is above zero, the answer is \"in the air\". Where it's below, \"on the ground\"."
board = "Axes: depth along the bottom, the total up the side. The line from (0, 176) falls to cross zero at 176; left of the crossing shaded 'in the air', right of it 'on the ground'"
cite = ["openstax-linear", "exp001"]

[[line]]
id = "balance"
text = "You can picture it as a balance scale with a yes pan and a no pan. Each input times its weight gives a number, and that number becomes a block as big as the number itself. A plus number goes in the yes pan, a minus number in the no pan. The bias is one more block, in the pan its own sign says. The neuron says yes when the yes pan holds more."
board = "The balance-scale sketch with labelled yes and no pans"
framing = true

[[line]]
id = "balance-mario"
text = "For Mario at depth 150: minus one times 150 is minus 150, so a block of 150 goes in the no pan. The bias is plus {smb1_height_cut}, so a block of {smb1_height_cut} goes in the yes pan. The yes pan holds more, so the scale tips to yes: in the air."
spoken = "For Mario at depth a hundred and fifty: minus one times a hundred and fifty is minus a hundred and fifty, so a block of a hundred and fifty goes in the no pan. The bias is plus {smb1_height_cut_spoken}, so a block of {smb1_height_cut_spoken} goes in the yes pan. The yes pan holds more, so the scale tips to yes: in the air."
board = "A 150 block drops into the no pan, a 176 block into the yes pan; the scale tips to yes"
framing = true

# --- Two numbers, and the border ---

[[line]]
id = "new-question"
text = "Now a question where two numbers do better than one. While Mario is in the air: will he land within the next {smb1_land_within} frames, a sixth of a second? The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within} frames and see whether the in-the-air number says he's landed in any of them."
spoken = "Now a question where two numbers do better than one. While Mario is in the air: will he land within the next {smb1_land_within_spoken} frames, a sixth of a second? The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within_spoken} frames and see whether the in-the-air number says he's landed in any of them."
board = "Mario mid-jump, a timer counting ten frames ahead"
cite = ["exp001"]

[[line]]
id = "two-inputs"
text = "This neuron reads his depth and a second number from the game's memory: his falling speed, in whole dots per frame. It's positive while he falls and negative while he rises."
board = "A second memory square lights up, negative as Mario rises, positive as he falls"
cite = ["datacrystal-smb1", "exp001"]

[[line]]
id = "the-map"
text = "Picture a map of every moment Mario was in the air, one dot for each moment, with his depth along the bottom, bigger to the right, and his falling speed up the side, bigger toward the top. Rising moments sit below the middle of the map, and falling ones above it."
board = "The map: depth across, bigger to the right; falling speed up, zero in the middle; real dots"
cite = ["exp001"]

[[line]]
id = "the-corner"
text = "The moments just before a landing on the floor gather toward the top right: deep on the screen, and falling fast."
board = "The 'lands soon' dots light up; those landing on the floor in the top right, those landing on blocks tinted differently in the middle"
cite = ["exp001"]

[[line]]
id = "the-border"
text = "A neuron reading both numbers splits that map with a straight border. Along the border, its total comes out exactly zero. On the top-right side the total is above zero, and the neuron says \"lands soon\". On the other side it's below zero: \"not yet\"."
spoken = "A neuron reading both numbers splits that map with a straight border. Along the border, its total comes out exactly zero. On the top-right side the total is above zero, and the neuron says lands soon. On the other side it's below zero: not yet."
board = "The border drawn across the map; the top-right side shaded 'lands soon'"
cite = ["bishop2006", "exp001"]

[[line]]
id = "settings-are-borders"
text = "Our first neuron had a border too: its setting was one point along the depths, with yes on one side and no on the other. A neuron reading only depth would draw a straight up-and-down border on this map. One reading only falling speed would draw a level one. Reading both, the border can lean."
board = "An up-and-down border, then a level one, then the leaning one between them"
cite = ["bishop2006"]

[[line]]
id = "how-found"
text = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether he really landed within the next {smb1_land_within} frames, the same way as the first setting. A neuron adjusting its own weights, a little after each mistake, is a later video."
spoken = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether he really landed within the next {smb1_land_within_spoken} frames, the same way as the first setting. A neuron adjusting its own weights, a little after each mistake, is a later video."
board = "Borders sweep and rotate across the map from the first two sessions; one stays"
cite = ["exp001"]

[[line]]
id = "one-dot"
text = "Before writing its border down, one useful fact. Go back to the first graph, of the total against the depth, and multiply the weight and the bias by ten. The line gets ten times steeper, but it still crosses zero at {smb1_height_cut}, and that crossing is all the answer depends on. So every answer stays the same. It works for any neuron: multiplying every weight and the bias by the same positive amount never changes an answer."
spoken = "Before writing its border down, one useful fact. Go back to the first graph, of the total against the depth, and multiply the weight and the bias by ten. The line gets ten times steeper, but it still crosses zero at {smb1_height_cut_spoken}, and that crossing is all the answer depends on. So every answer stays the same. It works for any neuron: multiplying every weight and the bias by the same positive amount never changes an answer."
board = "The first graph returns; the line steepens tenfold, pivoting about a lit dot at (176, 0) that never moves"
cite = ["bishop2006"]

[[line]]
id = "the-tilt"
text = "So we were free to scale the border's numbers. We scaled them until the depth's weight was one, then rounded: weights of one for the depth and {smb1_land_speed_weight} for the falling speed, and a bias of minus {smb1_land_threshold}. If the total is above zero, he lands soon."
spoken = "So we were free to scale the border's numbers. We scaled them until the depth's weight was one, then rounded: weights of one for the depth and {smb1_land_speed_weight_spoken} for the falling speed, and a bias of minus {smb1_land_threshold_spoken}. If the total is above zero, he lands soon."
board = "1 × depth + 5 × falling speed − 152 > 0, colour-coded, beside the border"
cite = ["exp001", "bishop2006"]

[[line]]
id = "why-plus"
text = "The depth's weight is plus one this time, not minus one, because this question's yes is the other way round: deeper means closer to the floor, so closer to landing. And the bias is minus {smb1_land_threshold} because the test is depth plus {smb1_land_speed_weight} times the falling speed being more than {smb1_land_threshold}; moving that {smb1_land_threshold} to the other side of the comparison turns it into minus {smb1_land_threshold}."
spoken = "The depth's weight is plus one this time, not minus one, because this question's yes is the other way round: deeper means closer to the floor, so closer to landing. And the bias is minus {smb1_land_threshold_spoken} because the test is depth plus {smb1_land_speed_weight_spoken} times the falling speed being more than {smb1_land_threshold_spoken}; moving that {smb1_land_threshold_spoken} to the other side of the comparison turns it into minus {smb1_land_threshold_spoken}."
board = "The depth weight flips from −1 to +1, with 'closer to the floor' beside it"
cite = ["exp001"]

[[line]]
id = "land-example"
text = "Say Mario's depth is 140 and his falling speed is 4: 140, plus 5 times 4, minus {smb1_land_threshold}, is 8. Above zero: lands soon. At the same depth but rising, at a falling speed of minus 2: 140, minus 10, minus {smb1_land_threshold}, is minus 22. Not yet."
spoken = "Say Mario's depth is a hundred and forty and his falling speed is four: a hundred and forty, plus five times four, minus {smb1_land_threshold_spoken}, is eight. Above zero: lands soon. At the same depth but rising, at a falling speed of minus two: a hundred and forty, minus ten, minus {smb1_land_threshold_spoken}, is minus twenty-two. Not yet."
board = "Two dots at depth 140, one above the border and one below, each with its sum"
framing = true

[[line]]
id = "steady-trade"
text = "On the map, the border drops one step of falling speed for every {smb1_land_speed_weight} steps of depth, at the same rate everywhere. That steady trade is why it's straight. In words: the further above the floor Mario is, the faster he has to be falling to land on it in time."
spoken = "On the map, the border drops one step of falling speed for every {smb1_land_speed_weight_spoken} steps of depth, at the same rate everywhere. That steady trade is why it's straight. In words: the further above the floor Mario is, the faster he has to be falling to land on it in time."
board = "A dot slides along the border: one step down in speed for five steps right in depth"
cite = ["exp001"]

[[line]]
id = "bias-slides"
text = "And just as changing b slides a line in school without changing its steepness, changing the neuron's bias slides its border without changing its lean."
board = "The border's lean changes as one weight changes; then it slides, keeping its lean, as the bias changes"
cite = ["openstax-linear", "bishop2006"]

[[line]]
id = "land-results"
text = "On the third session, most moments in the air are more than a sixth of a second from landing, so always answering \"not yet\" is right {smb1_land_baseline} of the time. A setting on depth alone does no better than that, {smb1_land_height_cut_accuracy}. A setting on falling speed alone gets {smb1_land_speed_cut_accuracy}. The leaning border, using both, gets {smb1_land_whole_accuracy}."
spoken = "On the third session, most moments in the air are more than a sixth of a second from landing, so always answering not yet is right {smb1_land_baseline_spoken} of the time. A setting on depth alone does no better than that, {smb1_land_height_cut_accuracy_spoken}. A setting on falling speed alone gets {smb1_land_speed_cut_accuracy_spoken}. The leaning border, using both, gets {smb1_land_whole_accuracy_spoken}."
board = "Four bars: 75%, 75%, 84%, 91%"
cite = ["exp001"]

[[line]]
id = "land-mistakes"
text = "Of the moments before a landing that it gets wrong, {smb1_land_whole_misses_on_raised} come before landings onto something raised, a block or a pipe, as with the first neuron. All this border knows about is the floor."
spoken = "Of the moments before a landing that it gets wrong, {smb1_land_whole_misses_on_raised_spoken} come before landings onto something raised, a block or a pipe, as with the first neuron. All this border knows about is the floor."
board = "Mario landing on a pipe while the neuron still says 'not yet'"
cite = ["exp001"]

# --- The one idea ---

[[line]]
id = "the-idea"
text = "One neuron multiplies each input by a weight, adds them up with a bias, and says yes if the total is above zero. On the map of its inputs, that's a straight border: yes on one side, no on the other. That's everything inside it. We can see all of it, and we know exactly what it does."
board = "The border across the map, yes on one side, no on the other"
framing = true

[[line]]
id = "modern"
text = "Today's artificial neurons are close cousins. They start from the same kind of weighted sum, usually with a bias, but they pass on a number instead of a bare yes or no. In one common kind, long recommended as the default, that number grows the further past the border the inputs are, and is zero on the other side."
board = "The yes/no light becomes a dial that rises the further past the border a dot sits, and reads zero on the no side"
cite = ["goodfellow2016"]

[[line]]
id = "harder"
text = "Now you know what one piece is. Networks built from huge numbers of them are much harder to see into than this single neuron, and that's what the rest of this series is about."
board = "The single dot, with a crowd of dots waiting faintly behind it"
cite = ["bluedot2024"]

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
