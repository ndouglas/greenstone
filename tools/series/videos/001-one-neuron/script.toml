title = "001: One neuron draws a line"

# --- Why look inside at all ---

[[line]]
id = "memory"
text = "A Nintendo Entertainment System's main working memory holds two thousand and forty-eight numbers, each between zero and two hundred and fifty-five, changing many times a second while a game runs."
board = "An NES; its 2,048 bytes of work RAM as a grid of numbers, changing as Mario runs"
cite = ["nesdev-memory", "exp001"]

[[line]]
id = "nobody-knows"
text = "The systems we now call artificial intelligence are built from enormous numbers of simple pieces called artificial neurons, loosely inspired by brain cells, and researchers understand very little of what goes on inside them."
board = "A network of dots and lines grows to thousands of dots, too many to follow"
cite = ["goodfellow2016-ch1", "bluedot2024"]

[[line]]
id = "answer-keys"
text = "Old games are a good place to study them, because some numbers in a game's memory have known meanings, like where the player is or whether he's jumping. So when we use a neuron to answer a question about a game, the game's own memory holds the right answer to check it against."
board = "Three squares in the grid light up with labels: position, lives, jumping"
cite = ["datacrystal-smb1"]

[[line]]
id = "doubters"
text = "Some researchers argue that studying these systems one piece at a time is misguided, and that we should study the patterns spread across many pieces instead. We'll give that argument its own video. To weigh it, you need to know what one piece is."
board = "The crowded network shrinks back to a single dot"
cite = ["hendrycks2025"]

[[line]]
id = "start-with-one"
text = "So we'll start with exactly one."
board = "One dot, alone, centre screen"
framing = true

# --- A thermostat ---

[[line]]
id = "thermostat"
text = "Begin with something you already know: picture a simple thermostat. It reads one number, the temperature, and compares it with its setting. Below the setting, the heat comes on. Above it, the heat goes off."
board = "A thermometer with a marked setting; the heat icon lights below it, goes dark above it"
framing = true

[[line]]
id = "simplest-neuron"
text = "The simplest kind of artificial neuron does something similar. It takes in numbers and gives each one a multiplier, called a weight, which says how much that number counts and which way it pushes. It adds them up, compares the total with a setting, and answers yes or no. Given just one number, it works like a thermostat."
board = "The thermometer becomes a number line with one mark; yes on one side, no on the other"
cite = ["goodfellow2016-ch1", "rosenblatt1958"]

# --- Mario: one number ---

[[line]]
id = "question"
text = "Here's a question about Super Mario Bros.: is Mario in the air right now?"
board = "Super Mario Bros. footage; Mario jumps, lands, runs"
framing = true

[[line]]
id = "answer-key"
text = "The game already knows. One number in its memory is zero while Mario is standing on something, one while he's in the air from a jump, and two while he's falling after walking off a ledge. One and two both mean: in the air."
board = "One square of the memory grid lights up and ticks between 0, 1 and 2 as Mario jumps and lands"
cite = ["datacrystal-smb1"]

[[line]]
id = "never-see"
text = "That number is our answer key. We'll use it to check the neuron, and to choose its setting, but the neuron itself never gets to read it."
board = "The answer-key square gets a padlock; a line from it runs to a scorecard, not to the neuron"
cite = ["exp001"]

[[line]]
id = "depth"
text = "Instead, the neuron reads a different number from the game's memory: Mario's depth, meaning how far down the screen he is, counted in dots. The number marks a spot 32 dots above his feet. A bigger depth means lower on the screen."
spoken = "Instead, the neuron reads a different number from the game's memory: Mario's depth, meaning how far down the screen he is, counted in dots. The number marks a spot thirty-two dots above his feet. A bigger depth means lower on the screen."
board = "Footage: a ruler counting down the screen to a mark 32 dots above Mario's feet (depth d puts his feet at screen row d + 32); the ruler's number follows him as he jumps"
cite = ["datacrystal-smb1", "nesdev-oam", "exp001"]

[[line]]
id = "recording"
text = "To get examples, we wrote a program that plays the game by picking buttons at random, mostly running right and often jumping, and starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths} seconds, so everything it recorded comes from the start of the first level."
spoken = "To get examples, we wrote a program that plays the game by picking buttons at random, mostly running right and often jumping, and starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths_spoken} seconds, so everything it recorded comes from the start of the first level."
board = "Fast-forwarded footage of the random player, dying and restarting"
cite = ["exp001"]

[[line]]
id = "frames"
text = "The NES draws about sixty pictures a second, called frames. We recorded three five-minute sessions and kept the game's memory from every frame."
board = "Three tapes labelled 1, 2, 3; a counter of frames ticking up"
cite = ["nesdev-timing", "exp001"]

[[line]]
id = "choosing"
text = "Then we tried every possible setting for the depth on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut}: exactly Mario's depth when he's standing on the floor of the level."
spoken = "Then we tried every possible setting for the depth on the first two sessions, and kept the one that matched the answer key most often. It came out at {smb1_height_cut_spoken}: exactly Mario's depth when he's standing on the floor of the level."
board = "A mark sweeps down the screen, a score for each position; it settles at the floor"
cite = ["exp001"]

[[line]]
id = "the-neuron"
text = "So our neuron is: if Mario's depth is less than {smb1_height_cut}, meaning he's above the floor, answer \"in the air\". Otherwise, answer \"on the ground\"."
spoken = "So our neuron is: if Mario's depth is less than {smb1_height_cut_spoken}, meaning he's above the floor, answer in the air. Otherwise, answer on the ground."
board = "The setting drawn across the screen at the floor; above it is marked 'in the air'"
cite = ["exp001"]

[[line]]
id = "baseline"
text = "Before we test it, the score to beat. We test on the third session, which the setting wasn't chosen on: new play, though on the same stretch of the same level. There, Mario was on the ground a little more than half the time, so always saying \"on the ground\" would be right {smb1_baseline} of the time."
spoken = "Before we test it, the score to beat. We test on the third session, which the setting wasn't chosen on: new play, though on the same stretch of the same level. There, Mario was on the ground a little more than half the time, so always saying on the ground would be right {smb1_baseline_spoken} of the time."
board = "A bar for 'always on the ground' at {smb1_baseline}"
cite = ["exp001"]

[[line]]
id = "result"
text = "Our one-number neuron is right {smb1_height_accuracy} of the time."
spoken = "Our one-number neuron is right {smb1_height_accuracy_spoken} of the time."
board = "A second bar at {smb1_height_accuracy}, beside the first"
cite = ["exp001"]

[[line]]
id = "not-a-fluke"
text = "Testing on new play is one way to check for a fluke. On the two sessions it was chosen on, the setting scored {smb1_height_train_accuracy}; a lucky fit to those would probably have scored worse on the new one, and it didn't. And choosing the setting on any one session by itself lands on {smb1_every_session_cut} every time."
spoken = "Testing on new play is one way to check for a fluke. On the two sessions it was chosen on, the setting scored {smb1_height_train_accuracy_spoken}; a lucky fit to those would probably have scored worse on the new one, and it didn't. And choosing the setting on any one session by itself lands on {smb1_every_session_cut_spoken} every time."
board = "Two bars side by side, {smb1_height_train_accuracy} on the first two sessions and {smb1_height_accuracy} on the third; then three session strips, each one's own best setting landing on {smb1_every_session_cut}"
cite = ["exp001"]

[[line]]
id = "steady-player"
text = "A program that plays more steadily, by fixed rules, gets through the whole first level and into the second. It picks the same setting too: {smb1_steady_player_cut}. How often each situation comes up depends on the player, but where the floor is doesn't: even in the second level, it's at the same depth."
spoken = "A program that plays more steadily, by fixed rules, gets through the whole first level and into the second. It picks the same setting too: {smb1_steady_player_cut_spoken}. How often each situation comes up depends on the player, but where the floor is doesn't: even in the second level, it's at the same depth."
board = "Footage of the steady player clearing 1-1 and entering 1-2; a fourth strip joins the three, its best setting also landing on {smb1_steady_player_cut}"
cite = ["exp001"]

[[line]]
id = "its-mistakes"
text = "{smb1_mistakes_on_ground_above_floor} of the neuron's mistakes on the third session come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but above the floor, so the neuron says he's in the air."
spoken = "{smb1_mistakes_on_ground_above_floor_spoken} of the neuron's mistakes on the third session come when Mario is standing on top of something, a block or a pipe. Then he's on the ground, but above the floor, so the neuron says he's in the air."
board = "Mario standing on a pipe; the setting line is below his feet; the neuron's answer flashes 'in the air' in error"
cite = ["exp001"]

[[line]]
id = "other-games"
text = "The same kind of neuron works in other games, each with its own setting, found and tested the same way. In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy} of the time, well above always saying \"on the ground\"."
spoken = "The same kind of neuron works in other games, each with its own setting, found and tested the same way. In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy_spoken} of the time, well above always saying on the ground."
board = "Super Mario Bros. 3: the setting at the floor; its bar at {smb3_height_accuracy}, the score-to-beat bar faint beside it"
cite = ["datacrystal-smb3", "exp001"]

[[line]]
id = "castlevania"
text = "In Castlevania, you play Simon, a monster hunter with a whip, and that game's answer key is a number that says whether he's jumping or being knocked backwards through the air. A neuron reading his depth is right {castlevania_height_accuracy} of the time, again well above always saying \"on the ground\"."
spoken = "In Castlevania, you play Simon, a monster hunter with a whip, and that game's answer key is a number that says whether he's jumping or being knocked backwards through the air. A neuron reading his depth is right {castlevania_height_accuracy_spoken} of the time, again well above always saying on the ground."
board = "Castlevania: the setting across the screen; its bar at {castlevania_height_accuracy}, the score-to-beat bar faint beside it"
cite = ["datacrystal-cv", "exp001"]

[[line]]
id = "why-weights"
text = "So far ours has read just one number. What makes a neuron more than a thermostat is that it can read several at once, each with its own weight."
board = "The neuron box: one input, then a second input slot appears, each with a multiplier"
cite = ["goodfellow2016-ch1"]

[[line]]
id = "recipe"
text = "Here's the full recipe. Take each input, x, and multiply it by its weight, w. Add up the results. Add one more number, called the bias, b. If the total is above zero, the answer is yes."
board = "x, w and b each appear and are labelled in turn; the total, and a light for yes"
cite = ["goodfellow2016-ch1", "goodfellow2016", "bishop2006"]

[[line]]
id = "formula"
text = "With one input, that's w·x + b > 0."
spoken = "With one input, that's: w times x, plus b, is above zero."
board = "w·x + b > 0 assembles, w in orange, x in blue, b in purple"
cite = ["goodfellow2016", "bishop2006"]

[[line]]
id = "bias-is-setting"
text = "Instead of comparing the total with a setting, the neuron adds the bias and compares with zero. For a neuron reading one number, the setting is still there in a new form: it's the value of that number where the total comes out exactly zero, where the answer flips."
board = "The formula ends '> 0'; the thermostat's setting mark stays on its number line, relabelled 'total is zero here'"
cite = ["goodfellow2016", "bishop2006"]

[[line]]
id = "why-zero"
text = "Why zero? Any fixed number would work. Asking whether the total is above 100 is the same as taking 100 off the bias and asking whether it's above zero. Zero is just the custom."
spoken = "Why zero? Any fixed number would work. Asking whether the total is above a hundred is the same as taking a hundred off the bias and asking whether it's above zero. Zero is just the custom."
board = "'> 100' on the right of the formula slides across and joins the bias as '- 100', leaving '> 0'"
cite = ["bishop2006"]

[[line]]
id = "our-numbers"
text = "For our Mario neuron, the weight is minus one, so that smaller depths give bigger totals: like the thermostat, whose heat comes on below its setting, this neuron's yes is at smaller depths. A bias of plus {smb1_height_cut} then puts the zero at a depth of {smb1_height_cut}: minus the depth, plus {smb1_height_cut}, is above zero exactly when the depth is less than {smb1_height_cut}. That's the same test as before, written the neuron's way."
spoken = "For our Mario neuron, the weight is minus one, so that smaller depths give bigger totals: like the thermostat, whose heat comes on below its setting, this neuron's yes is at smaller depths. A bias of plus {smb1_height_cut_spoken} then puts the zero at a depth of {smb1_height_cut_spoken}: minus the depth, plus {smb1_height_cut_spoken}, is above zero exactly when the depth is less than {smb1_height_cut_spoken}. That's the same test as before, written the neuron's way."
board = "The formula with -1 and {smb1_height_cut} filled in, beside 'depth < {smb1_height_cut}'"
cite = ["exp001"]

[[line]]
id = "example-air"
text = "If Mario's depth is 150: minus 150, plus {smb1_height_cut}, makes {smb1_example_air_total}. That's above zero, so: in the air."
spoken = "If Mario's depth is a hundred and fifty: minus a hundred and fifty, plus {smb1_height_cut_spoken}, makes {smb1_example_air_total_spoken}. That's above zero, so: in the air."
board = "Mario above the floor; the sum worked through, landing on {smb1_example_air_total} and a yes"
framing = true

[[line]]
id = "example-ground"
text = "If it's {smb1_height_cut}, standing on the floor: minus {smb1_height_cut}, plus {smb1_height_cut}, makes zero. That's not above zero, so: on the ground."
spoken = "If it's {smb1_height_cut_spoken}, standing on the floor: minus {smb1_height_cut_spoken}, plus {smb1_height_cut_spoken}, makes zero. That's not above zero, so: on the ground."
board = "Mario on the floor; the sum worked through, landing on 0 and a no"
framing = true

[[line]]
id = "school"
text = "If you remember y = mx + b from school, the total is exactly that, with the weight as m and the bias as b. Now draw a picture of it, and call it the graph: depth along the bottom, and the total up the side. At depth zero, the total is {smb1_height_cut}, the bias, and it drops one for every step of depth, so it's a straight line. It crosses zero at {smb1_height_cut}, the setting. The bias and the setting are the same number here only because the weight is minus one. Where the line is above zero, the answer is \"in the air\". Where it's below, \"on the ground\"."
spoken = "If you remember y equals m x plus b from school, the total is exactly that, with the weight as m and the bias as b. Now draw a picture of it, and call it the graph: depth along the bottom, and the total up the side. At depth zero, the total is {smb1_height_cut_spoken}, the bias, and it drops one for every step of depth, so it's a straight line. It crosses zero at {smb1_height_cut_spoken}, the setting. The bias and the setting are the same number here only because the weight is minus one. Where the line is above zero, the answer is in the air. Where it's below, on the ground."
board = "Axes labelled 'the graph': depth along the bottom, the total up the side. The line from (0, {smb1_height_cut}) falls to cross zero at {smb1_height_cut}; left of the crossing shaded 'in the air', right of it 'on the ground'"
cite = ["openstax-linear", "exp001"]

[[line]]
id = "one-dot"
text = "One more thing the graph shows, which we'll use to write the next neuron in whole numbers. Multiply the weight and the bias by three. At depth zero the total is now three times higher, and the line is three times steeper. The bias is now three times {smb1_height_cut}, but the setting is still {smb1_height_cut}: the line still crosses zero there, and still slopes down. Every total is three times what it was, and three times a plus number is still plus, three times a minus number still minus. So every answer stays the same. That's true of any neuron of this yes-or-no kind: multiplying all its weights and its bias by the same plus number never changes an answer."
spoken = "One more thing the graph shows, which we'll use to write the next neuron in whole numbers. Multiply the weight and the bias by three. At depth zero the total is now three times higher, and the line is three times steeper. The bias is now three times {smb1_height_cut_spoken}, but the setting is still {smb1_height_cut_spoken}: the line still crosses zero there, and still slopes down. Every total is three times what it was, and three times a plus number is still plus, three times a minus number still minus. So every answer stays the same. That's true of any neuron of this yes-or-no kind: multiplying all its weights and its bias by the same plus number never changes an answer."
board = "The graph's line steepens threefold, pivoting about a pin at ({smb1_height_cut}, 0) that never moves; the shading stays put"
cite = ["bishop2006"]

# --- Two numbers, and the border ---

[[line]]
id = "new-question"
text = "Now a question where two numbers do better than one. While Mario is in the air: will he land within the next {smb1_land_within} frames, a sixth of a second? The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within} frames and see whether the in-the-air number says he's landed in any of them."
spoken = "Now a question where two numbers do better than one. While Mario is in the air: will he land within the next {smb1_land_within_spoken} frames, a sixth of a second? The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within_spoken} frames and see whether the in-the-air number says he's landed in any of them."
board = "Mario mid-jump, a timer counting ten frames ahead"
cite = ["exp001"]

[[line]]
id = "two-inputs"
text = "This neuron reads his depth and a second number from the game's memory: his falling speed, in whole dots per frame. It's positive while he falls and negative while he rises."
board = "A second memory square lights up, negative as Mario rises, positive as he falls"
cite = ["datacrystal-smb1", "exp001"]

[[line]]
id = "the-map"
text = "Picture a map of every moment Mario was in the air, one point for each moment, with his depth along the bottom, bigger to the right, and his falling speed up the side, bigger toward the top. It isn't the graph: up the side is now a second number from the game, not the neuron's total. Rising moments sit below the level where his falling speed is zero, and falling ones above it."
board = "The map: depth across, bigger to the right; falling speed up, a line at zero; real points"
cite = ["exp001"]

[[line]]
id = "the-corner"
text = "The moments just before a landing on the floor gather toward the top right: deep on the screen, and falling fast."
board = "The 'lands soon' dots light up; those landing on the floor in the top right, those landing on blocks tinted differently in the middle"
cite = ["exp001"]

[[line]]
id = "the-border"
text = "A neuron reading both numbers splits that map with a straight border. Along the border, its total comes out exactly zero. On the top-right side the total is above zero, and the neuron says \"lands soon\". On the other side it's below zero: \"not yet\"."
spoken = "A neuron reading both numbers splits that map with a straight border. Along the border, its total comes out exactly zero. On the top-right side the total is above zero, and the neuron says lands soon. On the other side it's below zero: not yet."
board = "The border drawn across the map; the top-right side shaded 'lands soon'"
cite = ["bishop2006", "exp001"]

[[line]]
id = "settings-are-borders"
text = "Our first neuron had a border too: its setting was one point along the depths, with yes on one side and no on the other. A neuron reading only depth would draw a straight up-and-down border on this map. One reading only falling speed would draw a level one. Reading both, the border can lean."
board = "An up-and-down border, then a level one, then the leaning one between them"
cite = ["bishop2006"]

[[line]]
id = "bias-slides"
text = "So the border is the map's version of the graph's crossing point. Changing the bias slides it without changing its lean, because the bias adds the same amount to every total. Changing one weight compared with the other changes the lean."
board = "On the map: the border slides as the bias changes, keeping its lean; then the two weights change against each other and it leans"
cite = ["bishop2006"]

[[line]]
id = "how-found"
text = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether he really landed within the next {smb1_land_within} frames, the same way as the first setting. A neuron adjusting its own weights, a little after each mistake, is the next video."
spoken = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether he really landed within the next {smb1_land_within_spoken} frames, the same way as the first setting. A neuron adjusting its own weights, a little after each mistake, is the next video."
board = "Borders sweep and rotate across the map from the first two sessions; one stays"
cite = ["exp001"]

[[line]]
id = "the-tilt"
text = "Here, very nearly, is the border it found, written with whole numbers. Scaling a neuron's weights and bias by the same plus number, as we did on the graph, doesn't move its border on the map at all, so we scaled them until the depth's weight was one, then rounded: weights of one for the depth and {smb1_land_speed_weight} for the falling speed, and a bias of minus {smb1_land_threshold}. If the total is above zero, he lands soon."
spoken = "Here, very nearly, is the border it found, written with whole numbers. Scaling a neuron's weights and bias by the same plus number, as we did on the graph, doesn't move its border on the map at all, so we scaled them until the depth's weight was one, then rounded: weights of one for the depth and {smb1_land_speed_weight_spoken} for the falling speed, and a bias of minus {smb1_land_threshold_spoken}. If the total is above zero, he lands soon."
board = "1 × depth + {smb1_land_speed_weight} × falling speed − {smb1_land_threshold} > 0, colour-coded, beside the border"
cite = ["exp001", "bishop2006"]

[[line]]
id = "why-plus"
text = "The depth's weight is plus one this time, not minus one, because this question's yes is the other way round: deeper means closer to the floor, so closer to landing. And the bias is minus {smb1_land_threshold} for the reason we saw with 100: asking whether depth plus {smb1_land_speed_weight} times the falling speed is more than {smb1_land_threshold} is the same as taking {smb1_land_threshold} off and asking whether the total is above zero."
spoken = "The depth's weight is plus one this time, not minus one, because this question's yes is the other way round: deeper means closer to the floor, so closer to landing. And the bias is minus {smb1_land_threshold_spoken} for the reason we saw with a hundred: asking whether depth plus {smb1_land_speed_weight_spoken} times the falling speed is more than {smb1_land_threshold_spoken} is the same as taking {smb1_land_threshold_spoken} off and asking whether the total is above zero."
board = "The depth weight flips from −1 to +1, with 'closer to the floor' beside it; then '> {smb1_land_threshold}' slides across and becomes '− {smb1_land_threshold}'"
cite = ["exp001"]

[[line]]
id = "land-example"
text = "Say Mario's depth is 140 and his falling speed is 4: 140, plus {smb1_land_speed_weight} times 4, minus {smb1_land_threshold}, is {smb1_land_example_yes}. Above zero: lands soon. At the same depth but rising, at a falling speed of minus 2: 140, plus {smb1_land_speed_weight} times minus 2, which is minus {smb1_land_example_speed_no}, minus {smb1_land_threshold}, is minus {smb1_land_example_no}. Not yet."
spoken = "Say Mario's depth is a hundred and forty and his falling speed is four: a hundred and forty, plus {smb1_land_speed_weight_spoken} times four, minus {smb1_land_threshold_spoken}, is {smb1_land_example_yes_spoken}. Above zero: lands soon. At the same depth but rising, at a falling speed of minus two: a hundred and forty, plus {smb1_land_speed_weight_spoken} times minus two, which is minus {smb1_land_example_speed_no_spoken}, minus {smb1_land_threshold_spoken}, is minus {smb1_land_example_no_spoken}. Not yet."
board = "Two dots at depth 140, one above the border and one below, each with its sum"
framing = true

[[line]]
id = "balance"
text = "You can also picture a neuron as a balance scale with a yes pan and a no pan. Each input times its weight gives a number, and that number becomes a block as big as the number, leaving off any minus sign. A plus number goes in the yes pan, a minus number in the no pan. The bias is one more block, in the pan its own sign says. The neuron says yes when the yes pan holds more."
board = "The balance-scale sketch with labelled yes and no pans"
framing = true

[[line]]
id = "land-balance"
text = "For our example: the depth, 140, and {smb1_land_speed_weight} times the falling speed, {smb1_land_example_speed_yes}, go in the yes pan, and the bias's {smb1_land_threshold} in the no pan. The yes pan holds {smb1_land_balance_yes_pan}, more than {smb1_land_threshold}, so it tips to yes: lands soon."
spoken = "For our example: the depth, a hundred and forty, and {smb1_land_speed_weight_spoken} times the falling speed, {smb1_land_example_speed_yes_spoken}, go in the yes pan, and the bias's {smb1_land_threshold_spoken} in the no pan. The yes pan holds {smb1_land_balance_yes_pan_spoken}, more than {smb1_land_threshold_spoken}, so it tips to yes: lands soon."
board = "Blocks of 140 and {smb1_land_example_speed_yes} drop into the yes pan, a {smb1_land_threshold} block into the no pan; the scale tips to yes"
framing = true

[[line]]
id = "steady-trade"
text = "Moving left along the border, toward smaller depths, where Mario is higher up, the falling speed on the border goes up one step for every {smb1_land_speed_weight} steps of depth, at the same rate everywhere: {smb1_land_speed_weight} less depth takes {smb1_land_speed_weight} off the total, and one step more falling speed, times its weight of {smb1_land_speed_weight}, puts {smb1_land_speed_weight} back. That steady trade is why it's straight. In words: the further above the floor Mario is, the faster he has to be falling to land on it in time."
spoken = "Moving left along the border, toward smaller depths, where Mario is higher up, the falling speed on the border goes up one step for every {smb1_land_speed_weight_spoken} steps of depth, at the same rate everywhere: {smb1_land_speed_weight_spoken} less depth takes {smb1_land_speed_weight_spoken} off the total, and one step more falling speed, times its weight of {smb1_land_speed_weight_spoken}, puts {smb1_land_speed_weight_spoken} back. That steady trade is why it's straight. In words: the further above the floor Mario is, the faster he has to be falling to land on it in time."
board = "A marker slides left and up along the border: one step up in speed for {smb1_land_speed_weight} steps left in depth, with '−{smb1_land_speed_weight}' and '+{smb1_land_speed_weight}' adding to zero beside it"
cite = ["exp001"]

[[line]]
id = "land-results"
text = "On the third session, most moments in the air aren't within a sixth of a second of a landing, so always answering \"not yet\" is right {smb1_land_baseline} of the time. A setting on falling speed alone gets {smb1_land_speed_cut_accuracy}; depth alone does only about as well as always saying \"not yet\". The leaning border, using both, gets {smb1_land_whole_accuracy}."
spoken = "On the third session, most moments in the air aren't within a sixth of a second of a landing, so always answering not yet is right {smb1_land_baseline_spoken} of the time. A setting on falling speed alone gets {smb1_land_speed_cut_accuracy_spoken}; depth alone does only about as well as always saying not yet. The leaning border, using both, gets {smb1_land_whole_accuracy_spoken}."
board = "Three bars: {smb1_land_baseline}, {smb1_land_speed_cut_accuracy}, {smb1_land_whole_accuracy}; a faint 'depth alone' bar level with the first"
cite = ["exp001"]

[[line]]
id = "land-mistakes"
text = "About {smb1_land_whole_raised_share_of_all_mistakes} of its mistakes are landings on something raised, a block or a pipe, that it said weren't coming yet. Most of the rest are the opposite mistake: it says \"lands soon\", but he bounces off an enemy or falls into a pit. All this border knows about is the floor."
spoken = "About {smb1_land_whole_raised_share_of_all_mistakes_spoken} of its mistakes are landings on something raised, a block or a pipe, that it said weren't coming yet. Most of the rest are the opposite mistake: it says lands soon, but he bounces off an enemy or falls into a pit. All this border knows about is the floor."
board = "Mario landing on a pipe while the neuron says 'not yet'; then Mario bouncing off a Goomba, and dropping into a pit, while it says 'lands soon'"
cite = ["exp001"]

[[line]]
id = "the-idea"
text = "One neuron multiplies each input by a weight, adds them up with a bias, and says yes if the total is above zero. On the map of its inputs, that's a straight border: yes on one side, no on the other. That's all there is inside it, and we can see every part."
board = "The border across the map, yes on one side, no on the other"
cite = ["bishop2006", "goodfellow2016"]

[[line]]
id = "modern"
text = "Today's artificial neurons are close cousins. They start from the same kind of weighted sum, usually with a bias, but they pass on a number instead of a bare yes or no. In one common kind, which a standard textbook recommends as the default, that number grows the further onto the yes side of the border the inputs are, and is zero on the other side."
board = "The yes/no light becomes a dial that rises the further past the border a dot sits, and reads zero on the no side"
cite = ["goodfellow2016"]

[[line]]
id = "harder"
text = "Now you know what one piece is. Networks built from huge numbers of them are much harder to see into than this single neuron, and that's what the rest of this series is about."
board = "The single dot, with a crowd of dots waiting faintly behind it"
cite = ["bluedot2024"]

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
