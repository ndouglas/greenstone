title = "001: One neuron draws a line"

[[section]]
kind = "introduction"
title = "Introduction"

[[section.line]]
id = "nobody-knows"
text = "The systems we now call artificial intelligence are built from enormous numbers of simple pieces called artificial neurons, loosely inspired by brain cells."
board = "A network of dots and lines grows to thousands of dots"
cite = ["goodfellow2016-ch1"]

[[section.line]]
id = "nobody-knows-2"
text = "Researchers understand very little of what goes on inside these systems."
board = "The camera pushes into the tangle of dots; too many to follow"
cite = ["bluedot2024"]

[[section.line]]
id = "memory"
text = "Old games are a good place to try neurons out. A Nintendo Entertainment System's main working memory holds two thousand and forty-eight numbers, each between zero and two hundred and fifty-five, changing many times a second while a game runs."
board = "An NES; its 2,048 bytes of work RAM as a grid of numbers, changing as Mario runs"
cite = ["nesdev-memory", "exp001"]

[[section.line]]
id = "answer-keys"
text = "Some of those numbers have known meanings, like where the player is or whether he's jumping."
board = "Three squares in the memory grid light up with labels: position, lives, jumping"
cite = ["datacrystal-smb1"]

[[section.line]]
id = "answer-keys-2"
text = "So when we use a neuron to answer a question about a game, the game's own memory holds, or lets us work out, the right answer to check it against."
board = "A neuron's answer appears beside the lit memory square; a tick where they agree"
cite = ["exp001"]

[[section.line]]
id = "doubters"
text = "Some researchers argue that studying these systems one piece at a time is misguided, and that we should study the patterns spread across many pieces instead."
board = "Across the crowded network, broad patterns of lit dots sweep through"
cite = ["hendrycks2025"]

[[section.line]]
id = "doubters-2"
text = "We'll give that argument its own video. To weigh it, you need to know what one piece is."
board = "The crowded network shrinks back to a single dot"
framing = true
pause = 1.0

[[section.line]]
id = "start-with-one"
text = "So we'll start with exactly one: we'll build a neuron that answers a question about Super Mario Bros., test how good it is, write it down the way neurons like it are written, and then build one that reads two numbers at once."
board = "One dot, alone, centre screen; four small cards fan out beside it, one per step"
framing = true

[[section]]
kind = "chapter"
title = "Building one neuron"

[[section.line]]
id = "building-intro"
role = "intro"
text = "First, we need a neuron that can answer a question about a game, and to build one, we need to know what a neuron does."
board = "The single dot becomes a box with one input on the left and a light on the right"
framing = true

[[section.line]]
id = "thermostat"
text = "Begin with something you already know: picture a simple thermostat. It reads one number, the temperature, and compares it with its setting."
board = "A thermometer with a marked setting"
framing = true

[[section.line]]
id = "thermostat-2"
text = "Below the setting, the heat comes on. Above it, the heat goes off."
board = "The temperature falls below the mark and a heat icon lights; it rises past it and the icon goes dark"
framing = true

[[section.line]]
id = "simplest-neuron"
text = "The simplest kind of artificial neuron does something similar. It takes in numbers, adds them up, compares the total with a setting, and answers yes or no."
board = "Numbers flow into the box and add up; the total meets a mark, and a light says yes or no"
cite = ["goodfellow2016-ch1", "rosenblatt1958"]

[[section.line]]
id = "simplest-neuron-2"
text = "Given just one number, it works like a thermostat."
board = "The thermometer becomes a number line with one mark; yes on one side, no on the other"
cite = ["rosenblatt1958"]
pause = 1.0

[[section.line]]
id = "question"
text = "Here's a question about Super Mario Bros.: is Mario in the air right now?"
board = "Super Mario Bros. footage; Mario jumps, lands, runs"
framing = true

[[section.line]]
id = "answer-key"
text = "The game already knows. One number in its memory is zero while Mario is standing on something, one while he's in the air from a jump, and two while he's falling after walking off a ledge."
board = "One square of the memory grid lights up and ticks between 0, 1 and 2 as Mario jumps and lands"
cite = ["datacrystal-smb1"]

[[section.line]]
id = "answer-key-2"
text = "One and two both mean: in the air."
board = "The 1 and the 2 slide together under the words 'in the air'"
cite = ["datacrystal-smb1"]
pause = 1.0

[[section.line]]
id = "never-see"
text = "That number is our answer key. We'll use it to check the neuron, and to choose its setting, but the neuron itself never gets to read it."
board = "The answer-key square gets a padlock; a line from it runs to a scorecard, not to the neuron"
cite = ["exp001"]

[[section.line]]
id = "depth"
text = "Instead, the neuron reads a different number from the game's memory: Mario's depth, meaning how far down the screen he is, counted in the tiny dots the picture is made of. A bigger depth means lower on the screen."
board = "Footage: a ruler down the screen, its number following Mario as he jumps; its mark sits 32 dots above his feet, the gap labelled (depth d puts his feet at screen row d + 32)"
cite = ["datacrystal-smb1", "nesdev-oam", "exp001"]

[[section.line]]
id = "recording"
text = "To get examples, we wrote a program that plays the game by picking buttons at random, mostly running right and often jumping."
board = "Footage of the random player, with its buttons lighting up beneath it"
cite = ["exp001"]

[[section.line]]
id = "recording-2"
text = "It starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths} seconds, so everything it recorded comes from the start of the first level."
spoken = "It starts over at the beginning of the first level every time Mario dies. That was about every {smb1_seconds_between_deaths_spoken} seconds, so everything it recorded comes from the start of the first level."
board = "Fast-forwarded footage of the random player, dying and restarting"
cite = ["exp001"]

[[section.line]]
id = "frames"
text = "The NES draws about sixty pictures a second, called frames."
board = "A second of play laid out as sixty still pictures"
cite = ["nesdev-timing"]

[[section.line]]
id = "frames-2"
text = "We recorded three five-minute sessions and kept the game's memory from every frame."
board = "Three tapes labelled 1, 2, 3; a counter of frames ticking up"
cite = ["exp001"]

[[section.line]]
id = "frames-3"
text = "We left out the moments when the game moves Mario by itself, like when he dies or slides down the flagpole."
board = "On a tape, the dying and flagpole stretches grey out"
cite = ["exp001"]

[[section.line]]
id = "choosing"
text = "Then we tried every possible setting for the depth on the first two sessions, keeping the third aside to test it, and kept the setting that matched the answer key most often."
board = "A mark sweeps down the screen, a score beside it for each position; the third tape sits apart"
cite = ["exp001"]

[[section.line]]
id = "choosing-2"
text = "It came out at {smb1_height_cut}: exactly Mario's depth when he's standing on the floor of the level."
spoken = "It came out at {smb1_height_cut_spoken}: exactly Mario's depth when he's standing on the floor of the level."
board = "The mark settles at the floor, under Mario's feet"
cite = ["exp001"]

[[section.line]]
id = "the-neuron"
text = "So our neuron is: if Mario's depth is less than {smb1_height_cut}, meaning he's above the floor, answer \"in the air\". Otherwise, answer \"on the ground\"."
spoken = "So our neuron is: if Mario's depth is less than {smb1_height_cut_spoken}, meaning he's above the floor, answer in the air. Otherwise, answer on the ground."
board = "The setting drawn across the screen at the floor; above it is marked 'in the air'"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "building-end"
role = "conclusion"
text = "So we started with a thermostat and finished with a neuron that reads one number from the game's memory and answers a question about Mario. What we don't know yet is whether its answers are any good."
board = "The neuron box, its depth input and its 'in the air' light, with a question mark beside the light"
framing = true

[[section]]
kind = "chapter"
title = "Is it any good?"

[[section.line]]
id = "testing-intro"
role = "intro"
text = "An answer is only useful if it's usually right. So: how often is this neuron right, and how would we know it isn't luck?"
board = "A blank scorecard"
framing = true

[[section.line]]
id = "baseline"
text = "We test on the third session, which the setting wasn't chosen on: new play, though on the same stretch of the same level."
board = "The three tapes; the third slides forward"
cite = ["exp001"]
pause = 1.0

[[section.line]]
id = "baseline-2"
text = "First, the score to beat. There, Mario was on the ground a little more than half the time, so always saying \"on the ground\" would be right {smb1_baseline} of the time."
spoken = "First, the score to beat. There, Mario was on the ground a little more than half the time, so always saying on the ground would be right {smb1_baseline_spoken} of the time."
board = "A bar for 'always on the ground' at {smb1_baseline}"
cite = ["exp001"]

[[section.line]]
id = "result"
text = "Our one-number neuron is right {smb1_height_accuracy} of the time."
spoken = "Our one-number neuron is right {smb1_height_accuracy_spoken} of the time."
board = "A second bar at {smb1_height_accuracy}, beside the first"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "not-a-fluke"
text = "Testing on new play is one way to check for a fluke: a setting that fit the first two sessions only by luck would probably do worse on new play."
board = "The three tapes, the first two joined, the third apart"
cite = ["exp001"]

[[section.line]]
id = "not-a-fluke-2"
text = "On the first two it scored {smb1_height_train_accuracy}. On the new one, {smb1_height_accuracy}."
spoken = "On the first two it scored {smb1_height_train_accuracy_spoken}. On the new one, {smb1_height_accuracy_spoken}."
board = "Two bars side by side: {smb1_height_train_accuracy} and {smb1_height_accuracy}"
cite = ["exp001"]

[[section.line]]
id = "not-a-fluke-3"
text = "And choosing the setting on any one session by itself lands on {smb1_every_session_cut} every time."
spoken = "And choosing the setting on any one session by itself lands on {smb1_every_session_cut_spoken} every time."
board = "Three session strips, each one's own best setting landing on {smb1_every_session_cut}"
cite = ["exp001"]

[[section.line]]
id = "steady-player"
text = "A program that plays more steadily, by fixed rules, gets through the whole first level and into the second."
board = "Footage of the steady player clearing 1-1 and entering 1-2"
cite = ["exp001"]

[[section.line]]
id = "steady-player-2"
text = "It picks the same setting too: {smb1_steady_player_cut}."
spoken = "It picks the same setting too: {smb1_steady_player_cut_spoken}."
board = "A fourth strip joins the three, its best setting also on {smb1_steady_player_cut}"
cite = ["exp001"]

[[section.line]]
id = "steady-player-3"
text = "How often each situation comes up depends on the player, but where the floor is doesn't: even in the second level, it's at the same depth."
board = "1-1 and 1-2 side by side, one line across both floors"
cite = ["exp001"]

[[section.line]]
id = "other-games"
text = "The same kind of neuron works in other games, each with its own setting, found and tested the same way; in each game, every session picks the same setting."
board = "Super Mario Bros., Super Mario Bros. 3 and Castlevania side by side, each with its own setting line"
cite = ["exp001"]
pause = 1.0

[[section.line]]
id = "other-games-2"
text = "In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy} of the time, well above always saying \"on the ground\"."
spoken = "In Super Mario Bros. 3, the best setting comes out at that game's floor, and it's right {smb3_height_accuracy_spoken} of the time, well above always saying on the ground."
board = "Super Mario Bros. 3: the setting at the floor; its bar at {smb3_height_accuracy}, the score-to-beat bar faint beside it"
cite = ["datacrystal-smb3", "exp001"]

[[section.line]]
id = "castlevania"
text = "In Castlevania, you play Simon, a monster hunter with a whip, and that game's answer key is a number that says whether he's jumping or being knocked backwards through the air."
board = "Castlevania footage: Simon jumps, then is knocked back by an enemy"
cite = ["datacrystal-cv"]

[[section.line]]
id = "castlevania-2"
text = "A neuron reading his depth is right {castlevania_height_accuracy} of the time, again well above always saying \"on the ground\"."
spoken = "A neuron reading his depth is right {castlevania_height_accuracy_spoken} of the time, again well above always saying on the ground."
board = "Castlevania: the setting across the screen; its bar at {castlevania_height_accuracy}, the score-to-beat bar faint beside it"
cite = ["exp001"]

[[section.line]]
id = "testing-end-1"
text = "So the neuron is good: in three games, on play it wasn't chosen on, it's right far more often than always guessing the same answer."
board = "The three games' bars together, each with its three session strips"
cite = ["exp001"]

[[section.line]]
id = "its-mistakes"
text = "Back in Super Mario Bros., {smb1_mistakes_on_ground_above_floor} of the neuron's mistakes on the third session come when Mario is standing on top of something, a block or a pipe."
spoken = "Back in Super Mario Bros., {smb1_mistakes_on_ground_above_floor_spoken} of the neuron's mistakes on the third session come when Mario is standing on top of something, a block or a pipe."
board = "Mario standing on a pipe"
cite = ["exp001"]

[[section.line]]
id = "its-mistakes-2"
text = "There, he's on the ground, but above the floor, so the neuron says he's in the air."
board = "The setting line sits below his feet; the neuron's answer flashes 'in the air' in error"
cite = ["exp001"]

[[section.line]]
id = "testing-end"
role = "conclusion"
text = "So it goes wrong because all it knows about is the floor. Other questions need two numbers to answer well, and to write a neuron that reads two, we need the recipe."
board = "Mario on a pipe; then a second input slot, empty, beside the neuron"
cite = ["exp001"]

[[section]]
kind = "chapter"
title = "The recipe"

[[section.line]]
id = "recipe-intro"
role = "intro"
text = "Our neuron compares one number with a setting. Every neuron of this kind, however many numbers it reads, follows the same short recipe, and we need it to write one that reads two."
board = "The neuron box; a second, empty input slot appears beside the first"
cite = ["goodfellow2016"]

[[section.line]]
id = "recipe"
text = "Here's the full recipe. Take each input, x, and multiply it by a number called its weight, w, which says how much that input counts and which way it pushes. Add up the results."
board = "x and w appear and are labelled; their product joins a running total"
cite = ["goodfellow2016-ch1", "goodfellow2016", "bishop2006"]

[[section.line]]
id = "recipe-2"
text = "Add one more number, called the bias, b. If the total is above zero, the answer is yes: instead of a setting, the test is against zero."
board = "b joins the total; a light comes on for yes when the total passes zero"
cite = ["goodfellow2016", "bishop2006"]

[[section.line]]
id = "formula"
text = "With one input, that's w·x + b > 0."
spoken = "With one input, that's w times x, plus b, is above zero."
board = "w·x + b > 0 assembles, w in orange, x in blue, b in purple"
cite = ["goodfellow2016", "bishop2006"]
pause = 3.0

[[section.line]]
id = "our-numbers"
text = "For our Mario neuron, the weight is minus one, so smaller depths give bigger totals. Like the thermostat, whose heat comes on below its setting, this neuron's yes is at smaller depths."
board = "The formula with -1 filled in as the weight"
cite = ["exp001"]

[[section.line]]
id = "our-numbers-2"
text = "A bias of plus {smb1_height_cut} then makes the total zero at a depth of {smb1_height_cut}."
spoken = "A bias of plus {smb1_height_cut_spoken} then makes the total zero at a depth of {smb1_height_cut_spoken}."
board = "The formula with -1 and {smb1_height_cut} filled in"
cite = ["exp001"]

[[section.line]]
id = "example-air"
text = "If Mario's depth is {smb1_example_air_depth}: minus {smb1_example_air_depth}, plus {smb1_height_cut}, makes {smb1_example_air_total}. That's above zero, so: in the air."
spoken = "If Mario's depth is {smb1_example_air_depth_spoken}: minus {smb1_example_air_depth_spoken}, plus {smb1_height_cut_spoken}, makes {smb1_example_air_total_spoken}. That's above zero, so: in the air."
board = "Mario above the floor; the sum worked through, landing on {smb1_example_air_total} and a yes"
framing = true
pause = 3.0

[[section.line]]
id = "example-ground"
text = "If it's {smb1_height_cut}, standing on the floor: minus {smb1_height_cut}, plus {smb1_height_cut}, makes zero. That's not above zero, so: on the ground."
spoken = "If it's {smb1_height_cut_spoken}, standing on the floor: minus {smb1_height_cut_spoken}, plus {smb1_height_cut_spoken}, makes zero. That's not above zero, so: on the ground."
board = "Mario on the floor; the sum worked through, landing on 0 and a no"
framing = true

[[section.line]]
id = "bias-is-setting"
text = "So the setting hasn't gone anywhere: it's {smb1_height_cut}, the depth where the total comes out exactly zero and the answer flips. That's the same test as before, written the neuron's way."
spoken = "So the setting hasn't gone anywhere: it's {smb1_height_cut_spoken}, the depth where the total comes out exactly zero and the answer flips. That's the same test as before, written the neuron's way."
board = "The formula beside 'depth < {smb1_height_cut}'; the thermostat's setting mark, relabelled 'total is zero here'"
cite = ["exp001", "bishop2006"]

[[section.line]]
id = "why-zero"
text = "Why zero? Any fixed number would work. If the total is 130, asking whether it's above 100 is the same as asking whether 30 is above zero, so we can always take the 100 off the total, by taking it off the bias, and compare with zero instead."
spoken = "Why zero? Any fixed number would work. If the total is a hundred and thirty, asking whether it's above a hundred is the same as asking whether thirty is above zero, so we can always take the hundred off the total, by taking it off the bias, and compare with zero instead."
board = "130 > 100 becomes 30 > 0; then '> 100' on the right of the formula slides across and joins the bias as '- 100', leaving '> 0'"
cite = ["bishop2006"]
pause = 3.0

[[section.line]]
id = "why-zero-3"
text = "Computers do the same. To check whether a number is at least 10, the NES's processor takes 10 away and looks at whether it had to go below zero: the comparison becomes a comparison with zero."
spoken = "Computers do the same. To check whether a number is at least ten, the NES's processor takes ten away and looks at whether it had to go below zero: the comparison becomes a comparison with zero."
board = "The NES's chip; 'at least 10?' becomes '− 10: below zero?'; beside it, the real instruction from Super Mario Bros. at $801B, 'cmp #10', checking a digit of the top score"
cite = ["masswerk-6502", "smbdis", "exp001"]

[[section.line]]
id = "why-zero-2"
text = "And with zero, the test has no number of its own: everything is in the total. Since one times the bias is just the bias, the bias can be treated as one more weight, on an input that's always one."
board = "b turns into w₀ × 1: a weight on a new input fixed at 1"
cite = ["bishop2006"]

[[section.line]]
id = "recipe-end"
role = "conclusion"
text = "So we've gone from a setting to the recipe neurons like ours follow: a weight on each input, a bias, and a test against zero. Next, we draw it as a line, which shows we can multiply all its numbers by the same plus number without changing a single answer."
board = "The formula, with the thermostat's number line fading behind it"
framing = true

[[section]]
kind = "chapter"
title = "Drawing it"

[[section.line]]
id = "draw-intro"
role = "intro"
text = "Soon we'll want to turn a neuron's messy numbers into simple ones while barely changing its answers. Drawing the neuron as a line shows how."
board = "Empty axes fade in beside the formula"
framing = true

[[section.line]]
id = "school"
text = "If you remember y = mx + b from school, the total is exactly that, with the weight as m and the bias as b."
spoken = "If you remember y equals m x plus b from school, the total is exactly that, with the weight as m and the bias as b."
board = "y = mx + b appears under the neuron's formula; m lines up under w, b under b"
cite = ["openstax-linear"]

[[section.line]]
id = "school-2"
text = "Now let's draw it. We'll call this picture the graph: depth along the bottom, and the total up the side."
board = "Axes labelled 'the graph': depth along the bottom, the total up the side"
cite = ["openstax-linear"]

[[section.line]]
id = "school-3"
text = "At depth zero, the total is {smb1_height_cut}, the bias, and it drops one for every step of depth, so it's a straight line."
spoken = "At depth zero, the total is {smb1_height_cut_spoken}, the bias, and it drops one for every step of depth, so it's a straight line."
board = "The line drawn from (0, {smb1_height_cut}) downward"
cite = ["openstax-linear", "exp001"]

[[section.line]]
id = "school-4"
text = "It crosses zero at {smb1_height_cut}, the setting. The bias and the setting are the same number here only because the weight is minus one."
spoken = "It crosses zero at {smb1_height_cut_spoken}, the setting. The bias and the setting are the same number here only because the weight is minus one."
board = "A pin at the crossing, ({smb1_height_cut}, 0), labelled 'setting'"
cite = ["exp001"]

[[section.line]]
id = "school-5"
text = "Where the line is above zero, the answer is \"in the air\". Where it's below, \"on the ground\"."
spoken = "Where the line is above zero, the answer is in the air. Where it's below, on the ground."
board = "Left of the crossing shaded 'in the air', right of it 'on the ground'"
cite = ["exp001"]

[[section.line]]
id = "one-dot"
text = "Now multiply the weight and the bias by three."
board = "'× 3' appears beside the weight and the bias"
cite = ["bishop2006"]
pause = 0.5

[[section.line]]
id = "one-dot-2"
text = "At depth zero the total is now three times higher, and the line falls three times as steeply."
board = "The graph's line steepens threefold"
cite = ["bishop2006"]

[[section.line]]
id = "one-dot-3"
text = "But it still crosses zero at {smb1_height_cut}: the bias is now three times {smb1_height_cut}, and the setting hasn't moved."
spoken = "But it still crosses zero at {smb1_height_cut_spoken}: the bias is now three times {smb1_height_cut_spoken}, and the setting hasn't moved."
board = "The line pivots about the pin at ({smb1_height_cut}, 0), which never moves"
cite = ["bishop2006"]

[[section.line]]
id = "one-dot-4"
text = "Every total is three times what it was: three times a plus number is still plus, three times a minus number still minus, and three times zero is still zero. So every answer stays the same."
board = "The shading stays exactly where it was"
cite = ["bishop2006"]

[[section.line]]
id = "one-dot-4b"
text = "That works only because the test is against zero. Test against 100 instead, and a total of 50, a no, becomes 150, a yes."
spoken = "That works only because the test is against zero. Test against a hundred instead, and a total of fifty, a no, becomes a hundred and fifty, a yes."
board = "'> 100': a total of 50 below the line, tripled to 150, above it"
cite = ["bishop2006"]
pause = 3.0

[[section.line]]
id = "one-dot-5"
text = "That's true of any neuron of this yes-or-no kind: multiplying all its weights and its bias by the same plus number never changes an answer."
board = "Copies of a formula scaled by 2, 3 and 10, each giving the same yes and no"
cite = ["bishop2006"]

[[section.line]]
id = "draw-end"
role = "conclusion"
text = "So with one input, a neuron is a line, and its setting is where that line crosses zero; scaling its weight and bias by the same plus number changes nothing it says. Next, a neuron that reads two numbers."
board = "The graph and its pin; a second input slot fills beside the formula"
cite = ["bishop2006"]

[[section]]
kind = "chapter"
title = "Two numbers"

[[section.line]]
id = "two-intro"
role = "intro"
text = "Here's a new question, one where a single number really isn't enough: will Mario land soon? At the same depth, he might be rising or falling."
board = "Two Marios at the same depth, one rising, one falling"
cite = ["exp001"]

[[section.line]]
id = "new-question"
text = "While Mario is in the air: will he land within the next {smb1_land_within} frames, a sixth of a second?"
spoken = "While Mario is in the air: will he land within the next {smb1_land_within_spoken} frames, a sixth of a second?"
board = "Mario mid-jump, a timer counting ten frames ahead"
cite = ["exp001"]

[[section.line]]
id = "new-question-2"
text = "The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within} frames and see whether the in-the-air number says he's landed in any of them."
spoken = "The game doesn't store that answer, but we can work it out from the recording: we check the next {smb1_land_within_spoken} frames and see whether the in-the-air number says he's landed in any of them."
board = "The recording scrubs ten frames ahead and back; the answer-key square flips to 'on the ground' within the window"
cite = ["exp001"]

[[section.line]]
id = "two-inputs"
text = "This neuron reads his depth and a second number from the game's memory: his falling speed, in whole dots per frame. It's a plus number while he falls and a minus number while he rises."
board = "A second memory square lights up, minus as Mario rises, plus as he falls"
cite = ["datacrystal-smb1", "exp001"]

[[section.line]]
id = "the-map"
text = "Picture a map of every moment Mario was in the air, one point for each moment, with his depth along the bottom, bigger to the right, and his falling speed up the side, bigger toward the top."
board = "The map: depth across, bigger to the right; falling speed up; real points appear"
cite = ["exp001"]

[[section.line]]
id = "the-map-2"
text = "It isn't the graph: up the side is now a second number from the game, not the neuron's total."
board = "The graph, small, beside the map; its side reads 'total', the map's reads 'falling speed'; the graph fades"
cite = ["exp001"]

[[section.line]]
id = "the-map-3"
text = "In Mario's terms: right is nearer the floor, up is falling faster, and where his falling speed is below zero, he's rising."
board = "Arrows on the map labelled 'nearer the floor', 'falling faster', 'rising'"
cite = ["exp001"]

[[section.line]]
id = "the-corner"
text = "The moments just before a landing on the floor gather toward the top right: deep on the screen, and falling fast."
board = "The 'lands soon' points on the floor light up in the top right"
cite = ["exp001"]

[[section.line]]
id = "the-corner-2"
text = "Landings on blocks and pipes sit further left on the map, at smaller depths, because blocks and pipes are higher up the screen."
board = "The 'lands soon' points on blocks and pipes light up, in a different colour, further left"
cite = ["exp001"]

[[section.line]]
id = "the-border"
text = "A neuron reading both numbers splits that map with a straight border. Along the border, its total comes out exactly zero."
board = "The border drawn across the map"
cite = ["bishop2006", "exp001"]

[[section.line]]
id = "the-border-2"
text = "On the top-right side the total is above zero, and the neuron says \"lands soon\". On the other side it's below zero: \"not yet\"."
spoken = "On the top-right side the total is above zero, and the neuron says lands soon. On the other side it's below zero: not yet."
board = "The top-right side shaded 'lands soon', the other 'not yet'"
cite = ["bishop2006"]

[[section.line]]
id = "settings-are-borders"
text = "Our first neuron had a border too: its setting was one point along the depths, with yes on one side and no on the other."
board = "The first neuron's setting as a single mark on a depth line, yes and no either side"
cite = ["bishop2006"]

[[section.line]]
id = "settings-are-borders-2"
text = "A neuron reading only depth would draw a straight up-and-down border on this map, because its setting is one depth, whatever his speed. One reading only falling speed would draw a flat one."
board = "An up-and-down border, then a level one"
cite = ["bishop2006"]

[[section.line]]
id = "settings-are-borders-3"
text = "Reading both, the border can lean. It's the two-number version of the first neuron's setting."
board = "The leaning border settles between them; the graph's pin, small, beside it"
cite = ["bishop2006"]

[[section.line]]
id = "bias-slides"
text = "Changing the bias slides the border without changing its lean, because the bias adds the same amount to every total."
board = "On the map, the border slides as the bias changes, keeping its lean"
cite = ["bishop2006"]

[[section.line]]
id = "bias-slides-2"
text = "Making one weight bigger compared with the other changes the lean."
board = "The two weights change against each other, and the border leans"
cite = ["bishop2006"]

[[section.line]]
id = "how-found"
text = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether Mario really landed within the next {smb1_land_within} frames, the same way as the first setting."
spoken = "To find its border, a program tried a great many leaning borders on the first two sessions and kept the one that most often matched whether Mario really landed within the next {smb1_land_within_spoken} frames, the same way as the first setting."
board = "Borders sweep and rotate across the map from the first two sessions; one stays"
cite = ["exp001"]

[[section.line]]
id = "two-end-1"
role = "conclusion"
text = "So with two numbers, the neuron's setting becomes a border across a map of them, and a search has found the best of the borders it tried. Next, we read that border."
board = "The found border on the map, unlabelled"
cite = ["exp001"]

[[section]]
kind = "chapter"
title = "The border it found"

[[section.line]]
id = "found-intro"
role = "intro"
text = "A border on a map is hard to check by eye. Written as arithmetic, we can check any moment by hand and see why the border is straight."
board = "The border on the map, with two small cards fanning out beside it"
framing = true

[[section.line]]
id = "the-tilt"
text = "Written in whole numbers, the border the search found is very nearly: one times the depth, plus {smb1_land_speed_weight} times the falling speed, minus {smb1_land_threshold}."
spoken = "Written in whole numbers, the border the search found is very nearly: one times the depth, plus {smb1_land_speed_weight_spoken} times the falling speed, minus {smb1_land_threshold_spoken}."
board = "1 × depth + {smb1_land_speed_weight} × falling speed − {smb1_land_threshold}, colour-coded, beside the border"
cite = ["exp001"]

[[section.line]]
id = "the-tilt-3"
text = "If that total is above zero, he lands soon."
board = "'> 0' completes the formula, beside 'lands soon'"
cite = ["exp001"]

[[section.line]]
id = "the-tilt-2"
text = "The search's own numbers were long decimals. As on the graph, multiplying them all by the same plus number doesn't move the border, so we scaled them until the depth's weight was exactly one."
board = "The search's decimal weights, scaling up together; the border unmoved"
cite = ["exp001", "bishop2006"]

[[section.line]]
id = "the-tilt-4"
text = "Rounding the rest then moved the border only a hair, and barely changed its answers."
board = "The rounded numbers; the border shifts by a hair"
cite = ["exp001"]

[[section.line]]
id = "why-plus"
text = "The depth's weight is plus one this time, not minus one, because this question's yes is the other way round: deeper means closer to the floor, so closer to landing."
board = "The depth weight flips from −1 to +1, with 'closer to the floor' beside it"
cite = ["exp001"]

[[section.line]]
id = "why-plus-2"
text = "And the bias is minus {smb1_land_threshold} for the reason we saw when we asked why zero: asking whether depth plus {smb1_land_speed_weight} times the falling speed is more than {smb1_land_threshold} is the same as taking {smb1_land_threshold} off and asking whether the total is above zero."
spoken = "And the bias is minus {smb1_land_threshold_spoken} for the reason we saw when we asked why zero: asking whether depth plus {smb1_land_speed_weight_spoken} times the falling speed is more than {smb1_land_threshold_spoken} is the same as taking {smb1_land_threshold_spoken} off and asking whether the total is above zero."
board = "'> {smb1_land_threshold}' slides across and becomes '− {smb1_land_threshold}'"
cite = ["exp001"]

[[section.line]]
id = "steady-trade"
text = "Follow the border to the left, where Mario is higher up. For every {smb1_land_speed_weight} steps less depth, the border climbs one step of falling speed, at the same rate all the way along."
spoken = "Follow the border to the left, where Mario is higher up. For every {smb1_land_speed_weight_spoken} steps less depth, the border climbs one step of falling speed, at the same rate all the way along."
board = "A marker slides left and up along the border: one step up in speed for {smb1_land_speed_weight} steps left in depth"
cite = ["exp001"]

[[section.line]]
id = "steady-trade-2"
text = "{smb1_land_speed_weight} steps less depth takes {smb1_land_speed_weight} off the total; one step more falling speed, times its weight of {smb1_land_speed_weight}, adds {smb1_land_speed_weight} back. That steady trade is why it's straight."
spoken = "{smb1_land_speed_weight_spoken} steps less depth takes {smb1_land_speed_weight_spoken} off the total; one step more falling speed, times its weight of {smb1_land_speed_weight_spoken}, adds {smb1_land_speed_weight_spoken} back. That steady trade is why it's straight."
board = "'−{smb1_land_speed_weight}' and '+{smb1_land_speed_weight}' appear beside the marker and add to zero"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "steady-trade-3"
text = "In words, the border says: the further above the floor Mario is, the faster he has to be falling to land on it in time."
board = "Footage: Mario high and falling fast, then low and falling slowly, both landing on the floor"
cite = ["exp001"]

[[section.line]]
id = "land-example"
text = "Say Mario's depth is {smb1_land_example_depth} and his falling speed is {smb1_land_example_falling}: {smb1_land_example_depth}, plus {smb1_land_speed_weight} times {smb1_land_example_falling}, minus {smb1_land_threshold}, is {smb1_land_example_yes}. Above zero: lands soon."
spoken = "Say Mario's depth is {smb1_land_example_depth_spoken} and his falling speed is {smb1_land_example_falling_spoken}: {smb1_land_example_depth_spoken}, plus {smb1_land_speed_weight_spoken} times {smb1_land_example_falling_spoken}, minus {smb1_land_threshold_spoken}, is {smb1_land_example_yes_spoken}. Above zero: lands soon."
board = "A point at depth {smb1_land_example_depth}, above the border, with its sum"
framing = true
pause = 3.0

[[section.line]]
id = "found-end"
role = "conclusion"
text = "So the search gave us a border, and written down, it's one line of arithmetic that says: the higher Mario is, the faster he has to be falling to land on the floor soon. Next, a way to work it by only adding."
board = "The formula beside the border, and Mario mid-fall"
framing = true

[[section]]
kind = "chapter"
title = "Weighing it"

[[section.line]]
id = "weigh-intro"
role = "intro"
text = "Sums that take numbers away are hard to follow by ear. Here's a way to see a neuron's answer where every number is only ever added, to one pan or the other: weigh it."
board = "A balance scale appears beside the border's formula"
framing = true

[[section.line]]
id = "balance"
text = "Picture the neuron as a balance scale, with a yes pan and a no pan."
board = "A balance scale, its pans labelled yes and no"
framing = true
pause = 1.0

[[section.line]]
id = "balance-2"
text = "Each input times its weight gives a number, and that number becomes a block as big as the number, leaving off any minus sign."
board = "A number becomes a block of its size"
framing = true

[[section.line]]
id = "balance-3"
text = "A plus number goes in the yes pan, and a minus number in the no pan. The bias, the weight on that input that's always one, is one more block, in the pan its own sign says."
board = "A plus block drops into the yes pan, a minus block and the bias's block into the no pan"
framing = true

[[section.line]]
id = "balance-4"
text = "The neuron says yes when the yes pan holds more."
board = "The scale tips toward the heavier pan"
framing = true
pause = 1.0

[[section.line]]
id = "land-balance"
text = "Take Mario at depth {smb1_land_example_depth} again, as in the last chapter, but this time rising, at a falling speed of minus {smb1_land_example_rising}. The depth's {smb1_land_example_depth} goes in the yes pan."
spoken = "Take Mario at depth {smb1_land_example_depth_spoken} again, as in the last chapter, but this time rising, at a falling speed of minus {smb1_land_example_rising_spoken}. The depth's {smb1_land_example_depth_spoken} goes in the yes pan."
board = "A {smb1_land_example_depth} block drops into the yes pan"
framing = true

[[section.line]]
id = "land-balance-b"
text = "{smb1_land_speed_weight} times minus {smb1_land_example_rising} is minus {smb1_land_example_speed_no}, so a block of {smb1_land_example_speed_no} goes in the no pan, with the bias's {smb1_land_threshold}."
spoken = "{smb1_land_speed_weight_spoken} times minus {smb1_land_example_rising_spoken} is minus {smb1_land_example_speed_no_spoken}, so a block of {smb1_land_example_speed_no_spoken} goes in the no pan, with the bias's {smb1_land_threshold_spoken}."
board = "Blocks of {smb1_land_example_speed_no} and {smb1_land_threshold} drop into the no pan"
framing = true

[[section.line]]
id = "land-balance-2"
text = "The no pan holds {smb1_land_balance_no_pan}, more than {smb1_land_example_depth}, so it tips to no: not yet. The total is minus {smb1_land_example_no}."
spoken = "The no pan holds {smb1_land_balance_no_pan_spoken}, more than {smb1_land_example_depth_spoken}, so it tips to no: not yet. The total is minus {smb1_land_example_no_spoken}."
board = "The scale tips to no; the total, minus {smb1_land_example_no}, shown beneath it"
framing = true
pause = 3.0

[[section.line]]
id = "weigh-end"
role = "conclusion"
text = "So a neuron's answer can be weighed instead of summed, only ever adding, and it comes out the same: not yet. What's left is to see how often the border is right."
board = "The scale tipped to no, beside the border"
framing = true

[[section]]
kind = "chapter"
title = "Does it work?"

[[section.line]]
id = "land-test-intro"
role = "intro"
text = "A border is only as good as its answers. So, as before: how often is it right, and where does it go wrong?"
board = "A blank scorecard beside the map"
framing = true

[[section.line]]
id = "land-results"
text = "On the third session, most moments in the air aren't within a sixth of a second of a landing, so always answering \"not yet\" is right {smb1_land_baseline} of the time."
spoken = "On the third session, most moments in the air aren't within a sixth of a second of a landing, so always answering not yet is right {smb1_land_baseline_spoken} of the time."
board = "A bar for 'always not yet' at {smb1_land_baseline}"
cite = ["exp001"]

[[section.line]]
id = "land-results-2"
text = "A setting on falling speed alone gets {smb1_land_speed_cut_accuracy}."
spoken = "A setting on falling speed alone gets {smb1_land_speed_cut_accuracy_spoken}."
board = "A bar at {smb1_land_speed_cut_accuracy} for falling speed alone"
cite = ["exp001"]

[[section.line]]
id = "land-results-3"
text = "Depth alone does only about as well as always saying \"not yet\": it can't tell rising from falling."
spoken = "Depth alone does only about as well as always saying not yet: it can't tell rising from falling."
board = "A faint 'depth alone' bar, level with the first"
cite = ["exp001"]

[[section.line]]
id = "land-results-4"
text = "The leaning border, using both, gets {smb1_land_whole_accuracy}."
spoken = "The leaning border, using both, gets {smb1_land_whole_accuracy_spoken}."
board = "A third bar at {smb1_land_whole_accuracy}"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "land-mistakes"
text = "About {smb1_land_whole_raised_share_of_all_mistakes} of its mistakes are landings on something raised, a block or a pipe, that it said weren't coming yet."
spoken = "About {smb1_land_whole_raised_share_of_all_mistakes_spoken} of its mistakes are landings on something raised, a block or a pipe, that it said weren't coming yet."
board = "Mario landing on a pipe while the neuron says 'not yet'"
cite = ["exp001"]

[[section.line]]
id = "land-mistakes-2"
text = "Most of the rest are the opposite mistake: it says \"lands soon\", but he bounces off an enemy or falls into a pit."
spoken = "Most of the rest are the opposite mistake: it says lands soon, but he bounces off an enemy or falls into a pit."
board = "Mario bouncing off a Goomba, and dropping into a pit, while it says 'lands soon'"
cite = ["exp001"]

[[section.line]]
id = "land-mistakes-3"
text = "All this border knows about is the floor."
board = "Mario jumping and falling, 'lands soon' and 'not yet' updating frame by frame"
cite = ["exp001"]

[[section.line]]
id = "two-end"
role = "conclusion"
text = "So we've gone from one number and a setting to two numbers and a leaning border, which does better than either number alone. The recipe didn't change; only the number of inputs did. However many numbers it reads, one neuron like this can only split them with a straight border."
board = "The one-number setting and the two-number border side by side, the recipe beneath both"
cite = ["exp001", "bishop2006"]

[[section]]
kind = "conclusions"
title = "Conclusions"

[[section.line]]
id = "tldr"
text = "In short: one neuron of this kind multiplies each input by a weight, adds them up with a bias, and says yes if the total is above zero."
board = "The formula, alone"
cite = ["bishop2006", "goodfellow2016"]

[[section.line]]
id = "tldr-2"
text = "With one input, that's a setting, like a thermostat's. Reading Mario's depth, it was right about whether he was in the air {smb1_height_accuracy} of the time, against {smb1_baseline} for always saying \"on the ground\", and went wrong mostly when he stood on something raised."
spoken = "With one input, that's a setting, like a thermostat's. Reading Mario's depth, it was right about whether he was in the air {smb1_height_accuracy_spoken} of the time, against {smb1_baseline_spoken} for always saying on the ground, and went wrong mostly when he stood on something raised."
board = "The first neuron's setting across the screen, its bar at {smb1_height_accuracy} beside {smb1_baseline}"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "tldr-3"
text = "With two inputs, it's a straight border across a map of them. Reading depth and falling speed, it was right about whether he'd land soon {smb1_land_whole_accuracy} of the time, against {smb1_land_baseline} for always saying \"not yet\", and went wrong mostly where the floor wasn't what he'd land on."
spoken = "With two inputs, it's a straight border across a map of them. Reading depth and falling speed, it was right about whether he'd land soon {smb1_land_whole_accuracy_spoken} of the time, against {smb1_land_baseline_spoken} for always saying not yet, and went wrong mostly where the floor wasn't what he'd land on."
board = "The map and its border, its bar at {smb1_land_whole_accuracy} beside {smb1_land_baseline}"
cite = ["exp001"]
pause = 3.0

[[section.line]]
id = "the-idea"
text = "That's all there is inside this kind of neuron, and we can see every part of it."
board = "The border across the map, yes on one side, no on the other"
cite = ["bishop2006", "goodfellow2016"]

[[section.line]]
id = "modern"
text = "Today's artificial neurons are close cousins. They start from the same kind of weighted sum, often with a bias, but they pass on a number instead of a bare yes or no."
board = "The yes/no light becomes a dial"
cite = ["goodfellow2016"]

[[section.line]]
id = "modern-2"
text = "In one common kind, that number grows the further onto the yes side of the border the inputs are, and is zero on the other side; a widely used textbook recommended it as the default."
board = "The dial rises the further past the border a point sits, and reads zero on the no side"
cite = ["goodfellow2016"]

[[section.line]]
id = "harder"
text = "Networks built from huge numbers of them are much harder to see into than this single neuron, and that's what the rest of this series is about."
board = "The single dot, with a crowd of dots waiting faintly behind it"
cite = ["bluedot2024"]

[[section.line]]
id = "next"
text = "Before we look inside networks, one more thing a single neuron can show us: how it can try to find its own weights, bias included, by adjusting them a little after each mistake, and why, on these games, that never quite settles. That's the next video."
board = "The border on the map nudges after a wrong point, then again, never quite still"
cite = ["exp001"]

[[line]]
id = "disclaimer"
text = "I'm not an expert, just someone learning this in public. If you spot a mistake, please tell me."
board = "Plain card"
framing = true
