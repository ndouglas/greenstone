# NROM-256: 32 KB of program at $8000, 8 KB of tiles, horizontal mirroring.
MEMORY {
  ZP:     start = $00,   size = $100,  type = rw;
  OAMBUF: start = $0200, size = $100,  type = rw;
  RAM:    start = $0300, size = $500,  type = rw;
  HDR:    start = $0,    size = $10,   file = %O, fill = yes;
  PRG:    start = $8000, size = $8000, file = %O, fill = yes, fillval = $FF;
  CHR:    start = $0,    size = $2000, file = %O, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  OAM:      load = OAMBUF, type = bss, align = $100;
  BSS:      load = RAM,    type = bss;
  HEADER:   load = HDR,    type = ro;
  CODE:     load = PRG,    type = ro;
  RODATA:   load = PRG,    type = ro;
  VECTORS:  load = PRG,    type = ro, start = $FFFA;
  CHARS:    load = CHR,    type = ro;
}
